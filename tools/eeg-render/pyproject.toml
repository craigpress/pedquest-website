[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-render"
version = "0.3.0"
description = "Deterministic renderer for PedQuEST qEEG question-bank images (image.spec DSL -> PNG + JSON sidecar)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
datasets = ["wfdb>=4.1", "mne>=1.5"]
dev = ["pytest>=7.4"]

[project.scripts]
eeg-render = "eeg_render.cli:main"

[tool.setuptools]
packages = ["eeg_render", "eeg_render.datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
