# eeglab.presshome.net origin — serves EEG Teaching Lab recordings from the
# OMV folder `storage/eeg-lab` (bind-mounted read-only at /recordings).
#
# Access is by expiring signed URL only: the Next API mints
#   /<recording_id>/<file>?md5=<base64url(md5("<expires><uri> <secret>"))>&expires=<unix>
# and nginx's stock secure_link module verifies it. No directory listing, no
# unsigned access, Range honoured (nginx does that natively), CORS for the
# viewer origins, and every response logs bytes so bandwidth.sh can roll it up.
#
# The secret is injected by the compose file from /etc/eeglab/secret via the
# envsubst template mechanism (this file is copied to /etc/nginx/templates).

log_format eeglab '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                  '"$http_range" "$http_origin" $request_time';

map $http_origin $eeglab_cors {
    default "";
    "https://pedquest.org" $http_origin;
    "https://www.pedquest.org" $http_origin;
    "~^https://pedquest-website[a-z0-9-]*\.vercel\.app$" $http_origin;
    "http://localhost:3000" $http_origin;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/eeglab.access.log eeglab;

    # nothing at the root, nothing listed
    location = / { return 404; }
    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
        root /recordings;
        autoindex off;

        # CORS preflight carries no signature; answer it before the link check.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $eeglab_cors always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Accept-Encoding" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }

        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri ${EEGLAB_URL_SECRET}";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }

        # the viewer reads slices; never let a proxy compress or buffer them oddly
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-store" always;
        add_header Access-Control-Allow-Origin $eeglab_cors always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        add_header Vary Origin always;

        limit_except GET HEAD OPTIONS { deny all; }
    }
}
