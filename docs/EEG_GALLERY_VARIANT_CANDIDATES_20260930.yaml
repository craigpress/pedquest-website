- id: var-frontal-arousal-rhythm
  title: Frontal arousal rhythm
  category: variants
  subcategory: Drowsiness and sleep variants
  caption: 'Child arousing from N2: a frontocentral K-complex near 2.2 s precedes
    arousal with frontotemporal muscle at 5 s. Independently waxing rhythmic 8 Hz
    trains follow in the frontal and frontocentral chains, with smaller posterior
    spread.'
  tags:
    age: child
    state: awake
    montage: longitudinal_bipolar
    sensitivity_uv_mm: 7
