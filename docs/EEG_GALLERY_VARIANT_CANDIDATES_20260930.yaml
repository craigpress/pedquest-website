# Final reviewed variant specifications; supersedes initial candidates.
items:
- id: var-mu
  title: Mu rhythm
  category: variants
  subcategory: Awake variants
  caption: 'Right-predominant mu rhythm: sustained, waxing and waning 10 Hz arciform
    activity over the right sensorimotor region, mixed with the awake background;
    much smaller on the left. No ictal evolution or after-going slow wave.'
  tags:
    age: child
    state: awake
    montage: longitudinal_bipolar
    sensitivity_uv_mm: 7
  image:
    kind: eeg_page
    license: synthetic-original
    attribution: null
    spec:
      spec_version: 3
      seed: 29268201
      age_group: child
      sample_rate: 256
      channels: standard_19
      duration_min: 30
      at_min: 12.1
      window_s: 15
      sensitivity_uv_mm: 7
      montage: longitudinal_bipolar
      background:
        type: continuous
        dominant_hz: 9.0
        amplitude_uv: 65
        slow_fraction: 0.3
        reactivity: present
      events:
      - type: normal_variant
        kind: mu
        at_min: 12.0
        duration_s: 30
        context: movement
        side: right
        amplitude_uv: 32
        train_duration_s: 9
