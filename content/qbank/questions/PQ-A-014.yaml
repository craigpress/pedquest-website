id: PQ-A-014
version: 1
status: draft
title: Clicking the electrode chain where the seizure begins on the raw page
domain: seizure_detection
topics: [raw EEG confirmation, ictal onset localization, longitudinal bipolar montage, point to feature, ECG artifact]
population: child
setting: PICU
difficulty: intermediate
bloom: interpretation
learning_objective: >-
  Confirm a trend-flagged event on the raw EEG page by identifying the electrode chain
  in which the evolving ictal rhythm begins, while rejecting a rhythmic non-cerebral
  signal elsewhere on the page.

stem:
  vignette: >-
    A 4-year-old girl is admitted to the PICU after a prolonged convulsive seizure
    complicating gastroenteritis with hyponatraemia. She is intubated and sedated.
    Continuous EEG with a quantitative trend panel is running and an automated
    seizure-detection algorithm marks an event. You open the raw EEG at the marked
    time to confirm it before treating. The 15-second page shows, in one chain, a
    rhythmic sharply contoured discharge that begins at about 5 hertz and slows across
    the page with increasing amplitude and clear spread to the adjacent chain; in a
    separate chain there is a regular narrow deflection recurring at about 2 hertz
    that does not change in frequency or amplitude and is time-locked to the pulse
    oximeter tone.
  image_caption: >-
    Fifteen-second raw EEG page in longitudinal bipolar montage, 7 microvolts per
    millimetre, low-frequency filter 1 hertz, high-frequency filter 70 hertz, 60 hertz
    notch on. Chains are displayed in standard order with a single-lead ECG channel
    at the bottom of the page.
  lead_in: >-
    Click the electrode chain in which the electrographic seizure begins.

question_type: point_to_feature
options: []
point_to_feature:
  instruction: >-
    Click within the chain that shows the earliest evolving rhythmic discharge, not the
    chain with the regular pulse-locked deflection.
  target_event: 1
  target_panel: page
  tolerance: 0.05

explanation: >-
  The expected region is the left temporal chain, where the evolving ictal rhythm
  begins before spreading. What the image shows: in the left temporal chain a rhythmic,
  sharply contoured discharge starts near 5 hertz, slows progressively across the page,
  grows in amplitude, and then appears with a short delay in the adjacent left
  parasagittal chain, which is the definition of evolution and spread. The regular
  2 hertz deflection in the other chain has a fixed frequency, a fixed amplitude, an
  identical waveform on every beat, and a one-to-one relationship with the ECG channel
  at the bottom of the page; that is cardiac artifact and it does not evolve.
  Evidence: automated detectors mark candidate times but do not settle the diagnosis.
  In 19 continuous EEG recordings from critically ill children containing 379 seizures
  identified on raw EEG, four commercial algorithms detected 36.9, 92.3, 75.9 and
  74.4 percent of seizures, with daily false-positive rates averaging 4.7, 126.3, 5.1
  and 15.5 respectively; by comparison, EEG experts identified 76.5 percent of seizures
  using color density spectral array and 73.7 percent using aEEG, with daily
  false-positive rates of 1.7 and 1.5. The authors concluded that such algorithms may
  serve as early warning systems that prompt review of quantitative or raw EEG tracings.
  Bedside takeaway: treat every detector mark and every trend alarm as a pointer to a
  page of raw EEG, then assess whether ACNS seizure criteria and a plausible field are present.

key_points:
  - Ictal onset is the chain with the earliest evolving rhythmic discharge and spread.
  - Fixed-frequency deflections locked to the ECG channel are cardiac artifact.
  - Commercial detectors in children ranged from 36.9 to 92.3 percent sensitivity.

