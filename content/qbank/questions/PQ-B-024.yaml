id: PQ-B-024
version: 1
status: draft
title: Telling a pentobarbital effect from neurologic deterioration on a trend panel
domain: special_populations_pitfalls
topics: [sedation, pentobarbital, suppression ratio, prognostication pitfall, refractory status epilepticus]
population: child
setting: PICU
difficulty: advanced
bloom: analysis
learning_objective: >-
  Recognize a drug-induced rise in the suppression ratio that is time-locked to an
  infusion change, and defer background-based prognostication until sedation is accounted
  for.

stem:
  vignette: >-
    An 11-year-old girl with refractory status epilepticus from presumed autoimmune
    encephalitis has been on a midazolam infusion for 2 days. Seizures recur, and at
    minute 180 of the window shown the team escalates to a pentobarbital infusion titrated
    against the trend panel. Overnight the covering resident notes that the aEEG margins
    have fallen and the suppression-ratio trends have climbed, and asks whether she is
    deteriorating neurologically and whether the family should be told the prognosis has
    changed. Core temperature and blood pressure have been stable.
  image_caption: >-
    Ten-hour qEEG panel: seizure probability; rhythmicity spectrogram (left, right); FFT
    spectrogram 0-20 Hz (left, right); asymmetry index; aEEG (left, right); suppression
    ratio (left, right). Elapsed minutes on the time axis. The start of the pentobarbital
    infusion is annotated at 180 minutes.
  lead_in: >-
    Locate the point on the trend panel that explains the change the resident describes.

question_type: point_to_feature
options: []
point_to_feature:
  instruction: >-
    Click the point on the left suppression-ratio trend where the drug-induced change in
    background begins.
  target_event: 1
  target_panel: suppression_ratio_L
  tolerance: 0.03

explanation: >-
  The change begins at the annotated pentobarbital escalation at minute 180, and the
  correct click is the inflection of the left suppression-ratio trend at that moment. What
  the image shows: before minute 180 the rhythmicity spectrograms carry recurrent evolving
  bands and both suppression-ratio trends sit low; from minute 180 the rhythmicity bands
  disappear, the FFT panels lose almost all power above delta, the aEEG margins fall
  together on both sides, and both suppression-ratio trends ramp symmetrically over about
  20 minutes to a plateau near the titration target and stay there. The change is
  bilateral, symmetric, monotonic, time-locked to the infusion and unaccompanied by any
  asymmetry-index deflection, which is the signature of a pharmacologic effect rather than
  a new structural injury; a new ischemic event would be lateralized and would deflect the
  asymmetry index, and a metabolic deterioration would not begin at a single documented
  minute. Evidence: the American Clinical Neurophysiology Society consensus statement
  suggests continuous EEG specifically for assessment of the level of consciousness in
  patients receiving intravenous sedation or a pharmacologically induced coma, which is
  precisely the use here; the trend is the titration instrument, not a prognostic
  statement. Contemporary pediatric neuromonitoring reviews emphasize that sedative and
  anesthetic agents confound background-based prognostication and that the drug exposure
  at the time of recording must be documented alongside the read. Bedside takeaway: before
  calling a suppressed background a prognostic finding, look for a matching entry on the
  medication annotation line.

key_points:
  - A bilateral, symmetric suppression-ratio rise time-locked to an infusion change is pharmacologic.
  - A new structural injury lateralizes and deflects the asymmetry index; a drug effect does not.
  - Document the sedative exposure and dose alongside every background-based prognostic read.

