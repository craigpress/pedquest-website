id: PQ-A-006
version: 1
status: draft
title: Why a right frontal neonatal seizure is absent from a central aEEG channel
domain: foundations
topics: [aEEG, electrode derivation, spatial sampling, neonatal seizures, trend limitations]
population: neonate
setting: NICU
difficulty: intermediate
bloom: analysis
learning_objective: >-
  Explain how the choice of electrode derivation limits which neonatal seizures can
  appear on an aEEG, using published data on the proportion of neonatal seizures
  visible in a single cross-central channel.

stem:
  vignette: >-
    A term neonate born after an unremarkable pregnancy presents on day of life 2
    with intermittent right arm stiffening. Full-array conventional EEG with the
    reduced neonatal set is applied and a single-channel aEEG is derived across the
    central electrodes for the bedside team. Over 6 hours the conventional EEG records
    nine electrographic seizures, each 40 to 70 seconds long, all arising from the
    right frontal region with amplitudes of 30 to 45 microvolts and no clear spread.
    The neonatologist reviewing only the aEEG reports a normal continuous trace with
    no seizures. The recording contains no artifact and impedances were acceptable
    throughout.
  image_caption: >-
    Six-hour single-channel aEEG derived across the central electrodes, semilogarithmic
    amplitude axis, with the conventional EEG seizure times marked on a separate
    annotation strip below the trace. Time axis in hours from the start of recording.
  lead_in: >-
    What best explains why none of the nine seizures is visible on the aEEG trace?

question_type: multiple_choice
options:
  - key: A
    text: The seizures arose too far from the electrodes used to build the aEEG
    correct: true
    rationale: >-
      An aEEG samples only the derivation it is built from. Right frontal discharges
      that do not spread need not reach a cross-central channel, so no amplitude rise
      is generated and the trace stays normal.
  - key: B
    text: The 2 to 20 hertz band-pass filter removed the ictal rhythm
    correct: false
    rationale: >-
      Neonatal ictal rhythms fall largely within 2 to 20 hertz, which is the band the
      aEEG filter is designed to amplify rather than reject.
  - key: C
    text: The seizures were too long to raise the aEEG margin above baseline
    correct: false
    rationale: >-
      Longer seizures are more, not less, likely to be seen on aEEG; duration is one of
      the characteristics that predicts detection.
  - key: D
    text: The semilogarithmic axis compressed the ictal amplitude rise out of view
    correct: false
    rationale: >-
      The relevant amplitudes here sit at the bottom of the axis, where the scale is
      linear and expanded; compression applies above 10 microvolts.
  - key: E
    text: Therapeutic hypothermia suppressed the ictal amplitude below detection
    correct: false
    rationale: >-
      This neonate is not described as cooled, and hypothermia is not required to
      explain the finding when the derivation cannot see the involved region.

explanation: >-
  The correct answer is A. An aEEG reports amplitude from the specific derivation it is
  built from, so a focal seizure that never involves those electrodes produces no
  sufficient amplitude change and the trace can look normal. What the image shows: a
  continuous aEEG band with a stable lower margin and no arched upward deflections,
  while the annotation strip marks nine conventional-EEG seizures underneath, making
  the mismatch between the trend and the reference standard explicit. Evidence: in a
  study of 851 neonatal seizures from 125 conventional EEGs in infants of 34 to 50
  weeks conceptional age, 78 percent of all neonatal seizures appeared in the single
  C3 to C4 channel and 94 percent of the records had at least one seizure visible in
  that channel; seizures were briefer and lower in amplitude in that channel than on
  conventional EEG, and appearance in C3 to C4, seizure duration, seizure amplitude,
  seizure count per hour and the reader's aEEG experience all correlated with
  detection. In 12 term infants with hypoxic-ischemic encephalopathy, 68 percent of
  121 seizure patterns occurred over the centrotemporal region, which is why
  cross-central derivations perform as well as they do and why frontal-only events are
  the classic miss. A pediatric review makes the general point that abnormalities
  occurring far from the electrodes used to build the aEEG may not be detected.
  Bedside takeaway: know which electrodes your aEEG is derived from, and do not use
  a normal limited-channel aEEG to exclude a focal seizure outside or weakly represented in that derivation.

key_points:
  - An aEEG is most sensitive to events that produce a sufficient amplitude change in its derivation.
  - 78 percent of 851 neonatal seizures appeared in a single C3 to C4 channel.
  - 68 percent of neonatal seizure patterns in term HIE were centrotemporal, not frontal.

