image:
  kind: composite
  license: synthetic-original
  attribution: null
  spec:
    seed: 8100004
    age_group: child
    sample_rate: 256
    channels: standard_19
    layout: panel_over_page
    qeeg_panel:
      duration_min: 720
      background:
        type: suppressed
        dominant_hz: 1.0
        amplitude_uv: 8
        slow_fraction: 0.95
        reactivity: absent
      events:
        - type: seizure
          onset_min: 210.0
          duration_s: 35
          onset_region: right_central
          evolution: { start_hz: 2.0, end_hz: 1.2, amplitude_start_uv: 25, amplitude_end_uv: 40 }
          spread: none
        - type: seizure
          onset_min: 275.0
          duration_s: 30
          onset_region: right_central
          evolution: { start_hz: 2.0, end_hz: 1.2, amplitude_start_uv: 25, amplitude_end_uv: 40 }
          spread: none
        - type: stimulation
          at_min: 360
      annotations:
        - { at_min: 360, label: "Tracheal suctioning" }
      panels:
        - seizure_probability
        - rhythmicity_L
        - rhythmicity_R
        - fft_L
        - fft_R
        - asymmetry_index
        - suppression_ratio_L
        - suppression_ratio_R
      time_axis: elapsed
    eeg_page:
      at_min: 600.0
      window_s: 15
      sensitivity_uv_mm: 7
      montage: longitudinal_bipolar
      filters: { lf_hz: 1, hf_hz: 70, notch_hz: 60 }
      highlight: null

