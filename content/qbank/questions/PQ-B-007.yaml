# Verification trail: content/qbank/sources/PQ-B-007.md
id: PQ-B-007
version: 1
status: draft
title: The hourly seizure burden threshold above which neurologic decline rises sharply
domain: clinical_prognosis
topics: [seizure burden, rhythmicity spectrogram, neurologic decline, threshold, PICU]
population: child
setting: PICU
difficulty: intermediate
bloom: analysis
learning_objective: >-
  State the maximum hourly electrographic seizure burden above which both the probability
  and the magnitude of neurologic decline rose sharply in critically ill children.

stem:
  vignette: >-
    A 2-year-old girl is admitted to the PICU with acute encephalitis and altered mental
    status. Continuous video EEG with a quantitative trend panel is started on arrival.
    She is receiving levetiracetam and no continuous sedative infusion. Over the first 6
    hours the panel shows recurrent stereotyped electrographic seizures without a clinical
    correlate; in the worst single hour they occupy a little more than 14 minutes. The
    intensivist asks whether the burden has crossed the threshold at which published
    pediatric data show a steep rise in the risk of neurologic decline.
  image_caption: >-
    Six-hour qEEG panel: seizure probability; rhythmicity spectrogram (left, right); FFT spectrogram
    0-20 Hz (left, right); asymmetry index; suppression ratio (left, right). Elapsed time
    (hours:minutes) on the time axis. The levetiracetam load is annotated at 30 minutes.
  lead_in: >-
    Above what maximum hourly electrographic seizure burden did the probability and
    magnitude of neurologic decline rise sharply?

question_type: multiple_choice
options:
  - key: A
    text: 5 percent of an hour, about 3 minutes
    correct: false
    rationale: >-
      Risk did increase continuously with burden, but the inflection identified in the
      cohort was far higher than 5 percent of an hour.
  - key: B
    text: 10 percent of an hour, about 6 minutes
    correct: false
    rationale: >-
      A plausible guess, and close to a neonatal threshold reported elsewhere, but not
      the value at which the pediatric curve turned sharply upward.
  - key: C
    text: 20 percent of an hour, about 12 minutes
    correct: true
    rationale: >-
      Above a maximum seizure burden of 20 percent per hour, equal to 12 minutes in a
      given hour, both the probability and the magnitude of neurologic decline rose
      sharply across all diagnostic categories.
  - key: D
    text: 40 percent of an hour, about 24 minutes
    correct: false
    rationale: >-
      This overshoots the published inflection; children with burdens between 20 and 40
      percent per hour were already at markedly increased risk.
  - key: E
    text: 50 percent of an hour, about 30 minutes
    correct: false
    rationale: >-
      Half of an hour occupied by seizures would meet most definitions of electrographic
      status epilepticus and is well beyond the reported threshold.

explanation: >-
  The correct answer is C. What the image shows: the left and right rhythmicity
  spectrograms carry repeated discrete bands, each starting near 3 Hz and slowing over
  about 170 seconds and recurring every 12 minutes; the seizure-probability trend rises
  with each, the aEEG-independent FFT panels show matching low-frequency arches, and the
  asymmetry index deflects only transiently, so this is a generalized-onset stereotyped
  cluster rather than artifact. Summed across the worst hour, the ictal segments occupy
  slightly more than 20 percent of that hour. Evidence: in a prospective cohort of 259
  infants and children in pediatric and cardiac intensive care units who underwent
  clinically ordered continuous video EEG, seizures occurred in 93 (36 percent) and status
  epilepticus in 23 (9 percent), with a median monitoring duration of 37 hours. Children
  with neurologic decline had a mean maximum hourly seizure burden of 15.7 percent
  compared with 1.8 percent in those without decline. Above a maximum burden of 20 percent
  per hour, equal to 12 minutes, both the probability and the magnitude of decline rose
  sharply across diagnostic categories in this cohort, and each 1 percent increase in maximum hourly
  burden raised the odds of decline by 1.13 (95 percent confidence interval 1.05 to 1.21).
  Seizure burden was not associated with mortality. This observational inflection is a
  potential therapeutic target, not proof of a universal treatment deadline. Bedside
  takeaway: quantify burden and treat electrographic seizures promptly in clinical context.

key_points:
  - Above 20 percent of an hour, or 12 minutes, neurologic decline rose sharply in 259 children.
  - Each 1 percent rise in maximum hourly seizure burden raised the odds of decline by 1.13.
  - Seizure burden predicted neurologic decline but not mortality in this cohort.

