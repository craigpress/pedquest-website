id: PQ-A-021
version: 1
status: draft
title: Assigning the ACNS continuity category from the suppression ratio
domain: background_terminology
topics: [ACNS 2021 terminology, continuity, discontinuous, suppression ratio, attenuation]
population: child
setting: PICU
difficulty: introductory
bloom: recall
learning_objective: >-
  Match a measured percentage of suppression to the correct ACNS 2021 background
  continuity category, and state the percentage boundaries that define each category.

stem:
  vignette: >-
    A 6-year-old girl is admitted to the PICU with acute disseminated
    encephalomyelitis and a depressed level of consciousness. She receives no
    sedative infusion and no neuromuscular blockade. Continuous EEG with a
    quantitative trend panel is running. Because the team wants the trend to correspond
    to standard terminology, the technologist has set the suppression threshold on the
    trend to 10 microvolts. Over the displayed 3 hours the suppression ratio averages
    30 percent in both hemispheres and is stable. On the raw EEG page, periods during
    which all activity is below 10 microvolts alternate with periods of higher voltage
    mixed-frequency activity, and each low-voltage period lasts 2 to 4 seconds.
  image_caption: >-
    Composite display. Upper panel: 3-hour qEEG panel with suppression ratio (left, right), 0 to 100
    percent, threshold set at 10 microvolts, and aEEG (left, right). Lower panel: 15-second raw EEG
    page in longitudinal bipolar montage at 7 microvolts per millimetre. Time axis in hours:minutes.
  lead_in: >-
    Which ACNS 2021 background continuity category does this recording meet?

question_type: multiple_choice
options:
  - key: A
    text: Continuous, with no sustained periods of attenuation or suppression
    correct: false
    rationale: >-
      Continuous requires no meaningful periods of attenuation or suppression, whereas
      almost a third of this record is suppressed.
  - key: B
    text: Nearly continuous, 1 to 9 percent attenuation or suppression
    correct: false
    rationale: >-
      Nearly continuous is defined as continuous but with occasional periods, 1 to
      9 percent of the record, of attenuation or suppression lasting at least
      1 second; 30 percent is well above that ceiling.
  - key: C
    text: Discontinuous, 10 to 49 percent attenuation or suppression
    correct: true
    rationale: >-
      Discontinuous is a pattern of attenuation or suppression alternating with higher
      voltage activity, with 10 to 49 percent of the record consisting of attenuation or
      suppression, which is exactly what a stable 30 percent suppression ratio
      describes.
  - key: D
    text: Burst suppression, 50 to 99 percent attenuation or suppression
    correct: false
    rationale: >-
      Burst attenuation or burst suppression requires 50 to 99 percent of the record to
      consist of attenuation or suppression; the 2021 revision changed this from the
      previous greater-than-50-percent wording.
  - key: E
    text: Suppression, more than 99 percent of the record
    correct: false
    rationale: >-
      The suppression category applies when more than 99 percent of the record is
      suppressed, a threshold raised in 2021 from the previous requirement that the
      entirety of the record be involved.

explanation: >-
  The correct answer is C. The ACNS 2021 continuity categories are separated by the
  percentage of the record occupied by attenuation or suppression, and a suppression
  ratio measured with a 10 microvolt threshold reports approximately that same
  quantity. What the image shows: a flat bilateral suppression ratio near 30 percent
  with narrow aEEG bands, and a raw page on which 2 to 4 second periods of activity
  below 10 microvolts alternate with higher voltage mixed-frequency activity.
  Evidence: the ACNS 2021 terminology defines nearly continuous as continuous but with
  occasional, 1 to 9 percent of the record, periods of attenuation or suppression
  lasting at least 1 second; discontinuous as a pattern of attenuation or suppression
  alternating with higher voltage activity with 10 to 49 percent of the record
  consisting of attenuation or suppression; and burst attenuation or burst suppression
  as the same alternating pattern with 50 to 99 percent of the record so occupied.
  It further distinguishes attenuation, in which the lower-voltage periods are at least
  10 microvolts but less than 50 percent of the higher-voltage background, from
  suppression, in which the lower-voltage periods are below 10 microvolts, and notes
  explicitly that this voltage cutoff differs from the ACNS neonatal terminology. That
  last note matters here: the trend's threshold is user-configurable, so a suppression
  ratio can approximate the fraction of suppression when its threshold is 10 microvolts,
  but raw EEG review is still required because attenuation also contributes to the ACNS continuity category.
  Bedside takeaway: check the configured suppression threshold before you translate a
  trend percentage into a terminology category.

key_points:
  - Nearly continuous is 1 to 9 percent, discontinuous 10 to 49, burst suppression 50 to 99.
  - ACNS suppression means below 10 microvolts; attenuation means at least 10 microvolts.
  - A 10-microvolt suppression ratio does not measure attenuation; assign continuity from the raw EEG.

