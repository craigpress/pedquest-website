id: PQ-B-017
version: 1
status: draft
title: Locating the first electrographic seizure on a 24-hour trend panel
domain: monitoring_practice
topics: [time to first seizure, rhythmicity spectrogram, EMG artifact, screening workflow]
population: child
setting: PICU
difficulty: introductory
bloom: interpretation
learning_objective: >-
  Find the first electrographic seizure on a screening trend panel and relate its timing
  to published data on when seizures are first detected in critically ill children.

stem:
  vignette: >-
    A 3-year-old boy is admitted to the PICU after a 40-minute convulsive seizure during a
    febrile illness. He was intubated for airway protection and receives fentanyl only,
    with no continuous sedative infusion and no neuromuscular blockade. Continuous EEG
    with a quantitative trend panel is started 30 minutes after arrival and is screened by
    the bedside nurse each hour. The recording shown covers the first 24 hours. A
    levetiracetam load was given before the recording began, and no further medication was
    given in this window.
  image_caption: >-
    Twenty-four-hour qEEG panel: seizure probability; rhythmicity spectrogram (left, right); FFT
    spectrogram 0-20 Hz (left, right); asymmetry index; aEEG (left, right); suppression ratio (left,
    right). Elapsed time (hours:minutes) on the time axis. Suctioning is annotated at 15 minutes. No
    medication annotations fall within this window.
  lead_in: >-
    Locate the first electrographic seizure of this recording on the trend panel.

question_type: point_to_feature
options: []
point_to_feature:
  instruction: >-
    Click the first electrographic seizure on the left rhythmicity spectrogram. Do not
    click the suctioning artifact.
  target_event: 1
  target_panel: rhythmicity_L
  tolerance: 0.03

explanation: >-
  The first electrographic seizure is the discrete evolving band on the left rhythmicity
  spectrogram at about 40 minutes into the recording. What the image shows: at 15 minutes,
  time-locked to the annotated suctioning, there is a short, broadband, non-evolving rise
  across all displayed frequencies with a matching spike in the seizure-probability trend
  and no change in the asymmetry index; that is muscle and movement artifact. At about 40
  minutes a narrow band appears on the left that starts near 4 Hz and slows to about 1.5
  Hz over roughly 100 seconds, with a matching arch on the left FFT panel, a leftward
  deflection of the asymmetry index, a rise of the left aEEG margins and a brief
  post-ictal fall afterwards. Further stereotyped events follow through the night.
  Evidence: in a prospective study of 100 critically ill non-neonatal children with acute
  encephalopathy who underwent continuous EEG using predetermined monitoring indications,
  electrographic seizures occurred in 46 and electrographic status epilepticus in 19, and
  seizures were exclusively nonconvulsive in 32. Of the patients who had seizures, only 52
  percent had one detected in the first hour of monitoring, whereas 87 percent were
  detected within 24 hours. Younger age was the only clinical risk factor for seizure
  occurrence. The 52 percent denominator is seizure-positive patients; it does not mean a
  clean first hour excludes half of all possible seizures or halves an individual child's
  risk. Bedside takeaway: continue monitoring when the indication persists and screen the
  full recording.

key_points:
  - Only 52 percent of critically ill children with seizures had one in the first hour of monitoring.
  - Eighty-seven percent of those with seizures had one detected within 24 hours.
  - Suctioning makes a broadband, non-evolving rise; a seizure makes an evolving narrow band.

