# Verification trail: content/qbank/sources/PQ-B-011.md
id: PQ-B-011
version: 1
status: draft
title: Seizure burden thresholds and outcome in neonatal hypoxic-ischemic encephalopathy
domain: clinical_prognosis
topics: [neonatal seizure burden, HIE, aEEG, outcome threshold, hourly burden]
population: neonate
setting: NICU
difficulty: intermediate
bloom: analysis
learning_objective: >-
  State the maximum hourly and total electrographic seizure burdens above which the odds
  of an abnormal neurodevelopmental outcome rose in term neonates with hypoxic-ischemic
  encephalopathy.

stem:
  vignette: >-
    A term neonate with moderate hypoxic-ischemic encephalopathy is being cooled and has
    been monitored with amplitude-integrated EEG and a raw display since 5 hours of life.
    Recurrent electrographic seizures begin at 14 hours of life. Phenobarbital has been
    loaded once. Over the 4-hour window shown the seizures recur about every 15 minutes
    and each lasts about 3.5 minutes, so they occupy roughly 14 minutes of every hour.
    The neonatology fellow asks whether this burden has crossed a published threshold for
    worse outcome.
  image_caption: >-
    Four-hour, two-channel aEEG (C3-P3 and C4-P4) covering 14 to 18 hours of life, on the
    semilog amplitude axis, linear from 0 to 10 microvolts and logarithmic from 10 to 100
    microvolts. Hours of life are on the time axis. A 15-second raw EEG inset is shown.
    The phenobarbital load is annotated.
  lead_in: >-
    Above what maximum hourly electrographic seizure burden did the odds of an abnormal
    outcome rise about eightfold in this population?

question_type: multiple_choice
options:
  - key: A
    text: 1 minute per hour
    correct: false
    rationale: >-
      The mere presence of seizures was not associated with abnormal outcome in this
      cohort, so a threshold this low does not match the data.
  - key: B
    text: 5 minutes per hour
    correct: false
    rationale: >-
      A plausible guess, but the reported inflection for maximum hourly burden was
      substantially higher.
  - key: C
    text: 13 minutes per hour
    correct: true
    rationale: >-
      A maximum hourly seizure burden of more than 13 minutes per hour carried an odds
      ratio of 8.00 for abnormal outcome, independent of encephalopathy grade and cooling.
  - key: D
    text: 20 minutes per hour
    correct: false
    rationale: >-
      Twenty percent of an hour, or 12 minutes, is the threshold reported in a mixed
      pediatric intensive care cohort, not the neonatal hourly threshold of 13 minutes.
  - key: E
    text: 40 minutes per hour
    correct: false
    rationale: >-
      Forty minutes is the reported threshold for total cumulative seizure burden across
      the whole recording, not for burden within a single hour.

explanation: >-
  The correct answer is C. What the image shows: on both channels the band shows repeated
  abrupt rises of the lower margin with narrowing of the band, each lasting about 3.5
  minutes and recurring about every 15 minutes, on a discontinuous background; the raw
  inset taken during one of these rises shows evolving rhythmic activity, confirming that
  the rises are seizures rather than movement. Summing the ictal minutes gives roughly 14
  minutes in the worst hour, which is above the 13-minute threshold. Evidence: in an
  observational cohort of 47 term neonates with hypoxic-ischemic encephalopathy from both
  the pre-hypothermia and hypothermia eras, monitored with continuous EEG for a median of
  57.1 hours (interquartile range 33.5 to 80.5), 29 of 47 (62 percent) had electrographic
  seizures and 25 of 47 (53 percent) had an abnormal outcome at 24 to 48 months. The
  presence of seizures per se was not associated with abnormal outcome (p equals 0.126).
  However, the odds of abnormal outcome rose more than ninefold, odds ratio 9.56 (95
  percent confidence interval 2.43 to 37.67), with a total seizure burden of more than 40
  minutes, and eightfold, odds ratio 8.00 (2.06 to 31.07), with a maximum hourly burden of
  more than 13 minutes per hour. Controlling for electrographic encephalopathy grade or
  hypothermia did not change the direction of these relationships. Bedside takeaway: count
  ictal minutes per hour and cumulatively, and treat burden as the target.

key_points:
  - Maximum hourly burden above 13 minutes per hour carried an odds ratio of 8.00 for abnormal outcome.
  - Total burden above 40 minutes carried an odds ratio of 9.56 in the same 47-neonate cohort.
  - Presence of seizures alone was not associated with outcome; burden was.

