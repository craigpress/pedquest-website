id: PQ-A-011
version: 1
status: draft
title: Clicking the seizure onset on the left rhythmicity spectrogram
domain: seizure_detection
topics: [rhythmicity spectrogram, seizure onset, EMG artifact, point to feature, evolution]
population: child
setting: PICU
difficulty: intermediate
bloom: interpretation
learning_objective: >-
  Locate the onset of an evolving focal electrographic seizure on a hemispheric
  rhythmicity spectrogram and distinguish it from an earlier non-evolving muscle
  artifact on the same panel.

stem:
  vignette: >-
    A 9-year-old boy is admitted to the PICU with acute encephalopathy and new focal
    motor seizures on the right side of the body. He is intubated for airway protection
    and receives a low-dose midazolam infusion; no neuromuscular blockade has been
    given. Continuous EEG with a quantitative trend panel is started. Over the first
    3 hours the panel shows two candidate events. The first is a broad, non-evolving
    increase in power confined to the left temporal chain, coincident with a nursing
    note of oral care. The second is a discrete band on the left rhythmicity
    spectrogram that starts near 4 hertz and slows to about 1.5 hertz over roughly
    2 minutes, with a simultaneous rise in the left aEEG margins and a transient
    leftward deflection of the asymmetry index.
  image_caption: >-
    Three-hour qEEG panel, top to bottom: rhythmicity spectrogram (left, right); FFT spectrogram
    (left, right); relative asymmetry spectrogram and asymmetry index; aEEG (left, right). Time axis
    in hours:minutes from the start of recording. Oral care is annotated at 55 minutes.
  lead_in: >-
    Click the onset of the electrographic seizure on the left rhythmicity spectrogram
    panel.

question_type: point_to_feature
options: []
point_to_feature:
  instruction: >-
    Click the left rhythmicity spectrogram at the leading edge of the discrete
    evolving band, not at the earlier broadband event.
  target_event: 1
  target_panel: rhythmicity_L
  tolerance: 0.03

explanation: >-
  The expected region is the leading edge of the discrete rhythmicity band at
  118 minutes on the left rhythmicity spectrogram. What the image shows: two events
  that differ in kind. At 55 minutes, power rises across all frequencies at once,
  stays at one frequency, is confined to the left temporal chain, and is time-locked to
  an oral-care annotation; that is muscle artifact. At 118 minutes a narrow band
  appears near 4 hertz on the left rhythmicity spectrogram, slows to about 1.5 hertz
  over about 2 minutes, and is accompanied by a rise in the left aEEG margins, a
  transient leftward deflection of the asymmetry index, and a solid flame on the left
  FFT spectrogram, followed by a brief post-ictal fall in left amplitude. Evolution in
  frequency plus a concordant lateralised amplitude rise identifies a candidate focal
  seizure for confirmation on raw EEG. Evidence: in a pediatric ICU study of 27 continuous EEG
  recordings containing 553 seizures over 487 hours, neurophysiologists blinded to the
  raw EEG identified seizures with a median sensitivity of 83.3 percent using color
  density spectral array and 81.5 percent using aEEG, with sensitivity lowest for
  low-amplitude, short and focal seizures. A pediatric review of spectrograms for
  seizure detection in critically ill children makes the same point, that time-
  compressed trends improve the timeliness of diagnosis but do not replace raw-EEG
  confirmation. Bedside takeaway: a trend alarm marks a time, not a diagnosis; open the
  raw EEG at that time and look for evolution.

key_points:
  - Frequency evolution over 1 to 2 minutes marks a candidate seizure on the rhythmicity trend; confirm it on raw EEG.
  - Broadband non-evolving power confined to one chain and tied to care is artifact.
  - Blinded pediatric readers reached about 83 percent median sensitivity on CDSA.

