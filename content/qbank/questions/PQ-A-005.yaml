  spec:
    seed: 100505
    layout: panel_over_page
    qeeg_panel:
      age_group: child
      sample_rate: 256
      channels: standard_19
      duration_min: 240
      background:
        type: continuous
        dominant_hz: 7.5
        amplitude_uv: 50
        slow_fraction: 0.4
        reactivity: present
      events:
        - type: state_change
          at_min: 25
          to: sleep
        - type: state_change
          at_min: 60
          to: arousal
        - type: state_change
          at_min: 85
          to: sleep
        - type: state_change
          at_min: 130
          to: arousal
        - type: state_change
          at_min: 155
          to: sleep
        - type: state_change
          at_min: 195
          to: arousal
      panels:
        - rhythmicity_L
        - rhythmicity_R
        - fft_L
        - fft_R
        - aeeg_L
        - aeeg_R
      time_axis: elapsed
      style:
        spindle_hz: 12.5
        spindle_train_s: 180
        rhythmicity_hz_range: [1, 25]
