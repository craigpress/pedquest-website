id: PQ-A-005
version: 1
status: draft
title: What the rhythmicity spectrogram measures and which patterns it flags
domain: foundations
topics: [rhythmicity spectrogram, sleep spindles, posterior dominant rhythm, artifact, trend specificity]
population: child
setting: PICU
difficulty: intermediate
bloom: analysis
learning_objective: >-
  Describe what the rhythmicity spectrogram quantifies and explain why physiological
  and artifactual rhythms can produce the same dense band as an electrographic
  seizure.

stem:
  vignette: >-
    A 7-year-old girl is monitored in the PICU after a severe asthma exacerbation
    requiring intubation. Sedation has been weaned and she is now extubated but
    somnolent. Continuous EEG with a quantitative trend panel is running to exclude
    electrographic seizures. Overnight, the rhythmicity spectrogram develops repeated
    dense bands centred near 12 to 13 hertz, each lasting several minutes, recurring
    every 20 to 40 minutes. There is no accompanying change in the aEEG margins, no
    asymmetry deflection, and no clinical event recorded by the nurse. The raw EEG at
    one of these times is displayed beneath the trend panel. She receives no
    antiseizure medication and no respiratory treatment during the displayed window.
  image_caption: >-
    Composite display. Upper panel: 4-hour qEEG panel with rhythmicity spectrogram
    (left, right), FFT spectrogram (left, right) and aEEG (left, right). Lower panel:
    15-second raw EEG page in longitudinal bipolar montage taken from within one dense
    band, at 7 microvolts per millimetre.
  lead_in: >-
    Which explanation best accounts for the repeated dense bands on the rhythmicity
    spectrogram?

question_type: multiple_choice
options:
  - key: A
    text: Sleep spindles, because the trend scores any sustained rhythmic activity
    correct: true
    rationale: >-
      The rhythmicity spectrogram quantifies rhythmicity irrespective of whether the
      rhythm is ictal. Sleep spindles are sustained, near-sigma rhythmic bursts that
      recur cyclically with sleep and are a recognised source of non-ictal bands.
  - key: B
    text: Focal electrographic seizures, because rhythmicity bands are specific for ictal activity
    correct: false
    rationale: >-
      Rhythmicity is sensitive but not specific for seizures. A seizure would also be
      expected to evolve in frequency and to raise the aEEG margins, neither of which
      is present.
  - key: C
    text: Electrographic status epilepticus, because the bands recur over several hours
    correct: false
    rationale: >-
      Electrographic status epilepticus is continuous or near-continuous ictal activity;
      discrete bands separated by 20 to 40 minutes of normal-appearing trend do not meet
      that description.
  - key: D
    text: Sixty-hertz artifact, because line noise produces narrow rhythmic bands
    correct: false
    rationale: >-
      Line-frequency artifact appears at 60 hertz in North America, far above the
      12 to 13 hertz band seen here, and is among the artifacts that qEEG artifact
      reduction handles well.
  - key: E
    text: High-frequency chest wall oscillation, because the vest drives a rhythmic band
    correct: false
    rationale: >-
      Oscillation-vest artifact does produce a rhythmic band in this frequency
      neighbourhood, but no respiratory treatment was given during the displayed window
      and the recurrence interval follows sleep cycling instead.

explanation: >-
  The correct answer is A. The rhythmicity spectrogram is a density spectral array that
  displays greater rhythmicity as denser blue, calculated across sequential groupings
  of the 1 to 25 hertz frequency bands over time. It measures how rhythmic the signal
  is, not whether the rhythm is ictal, so any sustained rhythm in that range can
  produce a dense band. What the image shows: bands centred near 12 to 13 hertz that
  recur every 20 to 40 minutes without frequency evolution, with flat aEEG margins and
  no asymmetry deflection; the raw EEG page beneath resolves them as spindles rather
  than an ictal rhythm. Evidence: a pediatric neurocritical care review of trend
  construction states that the rhythmicity spectrogram is susceptible to highlighting
  non-ictal rhythmic patterns including sleep spindles, the posterior dominant rhythm,
  and repetitive artifacts such as respiratory treatments or patting; the same review
  reports that artifact-reduction algorithms handle line-frequency and myogenic
  artifact well but are less likely to remove rhythmic patting and respiratory therapy
  artifact, and it illustrates an oscillation-vest artifact in the 13 to 14 hertz range
  in an adolescent. In a mixed-age cohort of 562 seizures, spectrogram sensitivities
  for seizure detection ranged from 43 to 72 percent depending on the trend, which
  underscores that no single trend both finds all seizures and rejects all mimics.
  Bedside takeaway: a dense rhythmicity band is a prompt to open the raw EEG and the
  video at that time, and to ask what the bedside team was doing.

key_points:
  - Rhythmicity spectrogram quantifies rhythmicity across 1 to 25 hertz, not ictality.
  - Spindles, the posterior dominant rhythm, patting and vest therapy all create bands.
  - Cyclic recurrence without frequency evolution favours a physiological rhythm.

