id: PQ-A-022
version: 1
status: draft
title: Reporting highly epileptiform bursts during burst suppression
domain: background_terminology
topics: [ACNS 2021 terminology, burst suppression, highly epileptiform bursts, burst definition, suppression ratio]
population: child
setting: PICU
difficulty: intermediate
bloom: interpretation
learning_objective: >-
  Apply the ACNS 2021 criteria for a burst and for highly epileptiform bursts to a
  pharmacologically induced burst-suppression pattern displayed on a trend panel.

stem:
  vignette: >-
    A 10-year-old girl with super-refractory status epilepticus is receiving a
    pentobarbital infusion in the PICU. Continuous EEG with a quantitative trend panel
    is running with the suppression threshold set to 10 microvolts, and the suppression
    ratio has been stable at about 70 percent bilaterally for 4 hours. On the raw EEG,
    the bursts average 1.6 seconds and each contains six phases. Within roughly
    80 percent of the bursts there are three or four clearly epileptiform sharp waves,
    and within any single burst the interval between consecutive sharp waves averages
    about 0.4 seconds. The team is preparing the daily EEG report and must describe the
    bursts using ACNS 2021 terminology.
  image_caption: >-
    Four-hour qEEG panel, top to bottom: suppression ratio (left, right), 0 to 100
    percent, threshold 10 microvolts; aEEG (left, right); FFT spectrogram (left,
    right) with intermittent narrow columns of power. Time axis in minutes from the
    start of the displayed window.
  lead_in: >-
    How should the bursts be described in the report?

question_type: multiple_choice
options:
  - key: A
    text: Highly epileptiform bursts are present
    correct: true
    rationale: >-
      Two or more epileptiform discharges appear within the majority of bursts, and
      within a single burst the interpeak latency of about 0.4 seconds corresponds to
      roughly 2.5 hertz, which satisfies the requirement of an average of 1 hertz or
      faster.
  - key: B
    text: Highly epileptiform bursts are absent because discharges occur below 1 hertz
    correct: false
    rationale: >-
      An interpeak latency of about 0.4 seconds is a frequency of roughly 2.5 hertz,
      since the frequency is calculated as the inverse of the typical interpeak
      latency of consecutive discharges within a single burst.
  - key: C
    text: Highly epileptiform bursts are absent because fewer than half the bursts qualify
    correct: false
    rationale: >-
      Roughly 80 percent of the bursts contain the discharges, which exceeds the
      requirement that they appear within the majority, defined as more than 50
      percent, of bursts.
  - key: D
    text: Highly epileptiform bursts are absent because at least five discharges are required
    correct: false
    rationale: >-
      The 2021 criterion requires two or more epileptiform discharges within the
      majority of bursts, revised from the earlier wording of multiple discharges;
      three to four per burst clearly satisfies it.
  - key: E
    text: The events should be reported as discharges rather than bursts
    correct: false
    rationale: >-
      Bursts must average at least 0.5 seconds and have at least four phases; these
      average 1.6 seconds with six phases, so they qualify as bursts and not as
      discharges.

explanation: >-
  The correct answer is A. Reporting a burst-suppression pattern requires two separate
  judgements: whether the events even qualify as bursts, and whether those bursts are
  highly epileptiform. Both are met here. What the image shows: a stable suppression
  ratio near 70 percent bilaterally, which places the record in the ACNS burst
  attenuation or burst suppression category of 50 to 99 percent, with narrow aEEG
  bands and FFT spectrograms broken into intermittent narrow columns of power
  corresponding to the bursts. Evidence: the ACNS 2021 terminology states that bursts
  must average at least 0.5 seconds and have at least four phases, that is at least
  three baseline crossings, and that shorter or fewer-phase events should be
  considered discharges instead. It defines highly epileptiform bursts as present if
  two or more epileptiform discharges, spikes or sharp waves, are seen within the
  majority, more than 50 percent, of bursts and occur at an average of 1 hertz or
  faster within a single burst, with frequency calculated as the inverse of the typical
  interpeak latency of consecutive epileptiform discharges within a single burst, or if
  a rhythmic potentially ictal-appearing pattern occurs at 1 per second or faster
  within the majority of bursts. The 2021 version also narrowed burst suppression from
  greater than 50 percent to 50 to 99 percent of the record. Bedside takeaway: compute
  the within-burst discharge frequency from the interpeak latency, not from the number
  of discharges per burst.

key_points:
  - Bursts must average at least 0.5 seconds and contain at least four phases.
  - Highly epileptiform bursts need 2 or more discharges in over half of bursts at 1 hertz or faster.
  - Within-burst frequency is the inverse of the typical interpeak latency.

