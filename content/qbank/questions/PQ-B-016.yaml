# Verification trail: content/qbank/sources/PQ-B-016.md
id: PQ-B-016
version: 1
status: draft
title: Risk-stratified continuous EEG duration in a critically ill child
domain: monitoring_practice
topics: [monitoring duration, seizure risk stratification, epileptiform discharges, resource use]
population: child
setting: PICU
difficulty: introductory
bloom: application
learning_objective: >-
  Apply a risk-stratified model that combines age, prior clinically evident seizures and
  emergent EEG risk factors to choose a continuous EEG duration for a critically ill child.

stem:
  vignette: >-
    A 5-year-old girl is admitted to the PICU with encephalopathy after a systemic
    inflammatory illness. She has never had a clinically evident seizure. Continuous EEG
    with a quantitative trend panel is started on admission. She is receiving fentanyl but
    no continuous sedative infusion and no neuromuscular blockade. The first 6 hours,
    shown here, contain no electrographic seizures, no epileptiform discharges and no
    ictal-interictal continuum patterns. The intensivist needs the EEG machine for another
    admission and asks whether monitoring can stop now.
  image_caption: >-
    Six-hour qEEG panel: seizure probability; rhythmicity spectrogram (left, right); FFT
    spectrogram 0-20 Hz (left, right); asymmetry index; aEEG (left, right); suppression
    ratio (left, right). Elapsed minutes on the time axis. A caregiver-patting artifact is
    annotated at 150 minutes. No medication annotations fall within this window.
  lead_in: >-
    What is the shortest monitoring duration after which her residual risk of an
    electrographic seizure falls below 5 percent?

question_type: multiple_choice
options:
  - key: A
    text: 6 hours
    correct: true
    rationale: >-
      A child of 1 year or older with no prior clinically evident seizures and no
      emergent EEG risk factors reached a residual electrographic seizure risk below 5
      percent after 6 hours of monitoring.
  - key: B
    text: 12 hours
    correct: false
    rationale: >-
      Twelve hours is not one of the model's decision points, and this child's risk
      profile is already the lowest of the six groups described.
  - key: C
    text: 24 hours
    correct: false
    rationale: >-
      One day is the duration for children under 1 year without risk factors, or for
      children of 1 year or older who have either prior seizures or emergent EEG risks.
  - key: D
    text: 48 hours
    correct: false
    rationale: >-
      Two days applies to children of 1 year or older with both prior seizures and EEG
      risk factors, or to infants under 1 year with EEG risk factors.
  - key: E
    text: 60 hours
    correct: false
    rationale: >-
      Two and a half days was required only for infants under 1 year with prior seizures,
      regardless of emergent EEG risk factors.

explanation: >-
  The correct answer is A. What the image shows: the rhythmicity spectrograms are empty
  apart from a broadband, non-evolving, bilateral rise at the annotated patting artifact
  at 150 minutes; the seizure-probability trend is flat except at that artifact; the FFT
  spectrograms show symmetric slow-dominant power without arches; the aEEG margins are
  continuous and stable; and the asymmetry index stays near zero. There is therefore no
  seizure and no emergent EEG risk factor in the first 6 hours. Evidence: a prospective
  observational cohort of 719 consecutive critically ill children with encephalopathy
  used two baseline clinical risk factors, age and prior clinically evident seizures, and
  two emergent EEG risk factors, epileptiform discharges and ictal-interictal continuum
  patterns, in a multistate survival model. Electrographic seizures occurred in 184
  children (26 percent). Patients reached a residual risk below 5 percent after 6 hours if
  they were 1 year or older without prior seizures or EEG risk factors; 1 day if under 1
  year without prior seizures or EEG risks, or 1 year or older with either; 2 days if 1
  year or older with both, or under 1 year with EEG risks but no prior seizures; and 2.5
  days if under 1 year with prior seizures. For a residual risk below 2 percent, only the
  no-risk-factor groups needed longer, at 1.5 days under 1 year and 1 day at 1 year or
  older. Bedside takeaway: record the four risk factors explicitly, then set the stop time.

key_points:
  - Age 1 year or older with no prior seizures and no EEG risk factors reached under 5 percent risk at 6 hours.
  - Emergent EEG risk factors are epileptiform discharges and ictal-interictal continuum patterns.
  - Infants under 1 year with prior seizures needed 2.5 days to reach the same threshold.

