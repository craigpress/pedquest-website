# Verification trail: content/qbank/sources/PQ-B-001.md
id: PQ-B-001
version: 1
status: draft
title: Naming the aEEG background pattern in a cooled term neonate
domain: background_terminology
topics: [aEEG, pattern classification, burst suppression, neonatal HIE, ACNS neonatal terminology]
population: neonate
setting: NICU
difficulty: introductory
bloom: interpretation
learning_objective: >-
  Classify a neonatal aEEG background using the CNV, DNV, BS, CLV and FT scheme and
  name the feature that separates burst suppression from discontinuous normal voltage.

stem:
  vignette: >-
    A term neonate is admitted on the day of birth after a sentinel event during labor,
    with a cord arterial pH of 6.9 and a 10-minute Apgar score of 4. The examination
    shows stupor, absent suck and diffuse hypotonia. Therapeutic hypothermia is started
    at 4 hours of life and core temperature has been held at 33.5 degrees Celsius.
    Two-channel amplitude-integrated EEG with a raw tracing is running from 5 hours of
    life. The infant has received one fentanyl bolus, 6 hours before this window, and no
    antiseizure medication. The neonatal nurse practitioner asks you to name the
    background pattern before rounds.
  image_caption: >-
    Six-hour, two-channel aEEG (C3-P3 and C4-P4) on the conventional semilog amplitude
    axis, linear from 0 to 10 microvolts and logarithmic from 10 to 100 microvolts, with
    hours from the start of recording on the time axis. A 15-second raw EEG inset is
    shown. No medication marks or annotations fall within this window.
  lead_in: Which aEEG background pattern best describes this tracing?

question_type: multiple_choice
options:
  - key: A
    text: Burst suppression
    correct: true
    rationale: >-
      The trace is discontinuous with an essentially isoelectric lower margin between
      high-voltage bursts, and the interburst segments show no residual variability.
      That combination defines burst suppression on aEEG.
  - key: B
    text: Continuous low voltage
    correct: false
    rationale: >-
      Continuous extremely low voltage is a continuous trace whose whole band sits at a
      low amplitude; there are no discrete high-voltage bursts rising out of an
      isoelectric baseline.
  - key: C
    text: Continuous normal voltage
    correct: false
    rationale: >-
      Continuous normal voltage has an unbroken band with the lower margin above the
      isoelectric line throughout. This tracing is interrupted by long, flat interburst
      intervals.
  - key: D
    text: Discontinuous normal voltage
    correct: false
    rationale: >-
      Discontinuous normal voltage is also interrupted, but the interburst segments
      retain measurable low-voltage activity rather than falling to an isoelectric
      lower margin. That is the discriminating feature here.
  - key: E
    text: Flat trace
    correct: false
    rationale: >-
      A flat trace is mainly isoelectric throughout, without recurring high-voltage
      bursts. Bursts reaching well above the normal upper margin exclude this category.

explanation: >-
  The correct answer is A: the tracing is burst suppression because high-voltage bursts
  rise out of an interburst segment whose lower margin is essentially isoelectric. What
  the image shows: both channels are discontinuous, with bursts recurring roughly every
  9 seconds, an upper margin that climbs well above the normal band during each burst,
  and an interburst lower margin pinned at the bottom of the linear part of the axis
  with no residual variability. Sleep-wake cycling is absent and the raw inset confirms
  that the flat segments are suppression rather than a display artifact. The single
  discriminator against discontinuous normal voltage is the interburst amplitude, not the
  burst amplitude: discontinuous normal voltage keeps measurable activity between bursts.
  Evidence: Toet and colleagues classified aEEG in 73 asphyxiated term infants, 68 of
  whom were followed for 12 months or more, using this five-pattern scheme (flat trace,
  continuous extremely low voltage, burst suppression, discontinuous normal voltage and
  continuous normal voltage). Burst suppression together with flat trace and continuous
  low voltage predicted poor outcome with a sensitivity of 0.85 and a specificity of
  0.77 at 3 hours of age and 0.91 and 0.86 at 6 hours. In 872 cooled neonates monitored
  with three-channel aEEG, seizures occurred in 33.9 percent overall and the worse the
  early background, the higher the seizure risk. Bedside takeaway: read the interburst
  lower margin, and confirm it on the raw tracing before you call a background
  suppressed.

key_points:
  - Burst suppression on aEEG means high-voltage bursts over an essentially isoelectric interburst lower margin.
  - Discontinuous normal voltage keeps measurable activity between bursts; that is the discriminator.
  - Burst suppression, low voltage or flat trace at 6 hours predicted poor outcome in term asphyxia.

