# Verification trail: content/qbank/sources/PQ-B-025.md
id: PQ-B-025
version: 3
status: draft
title: Explaining the fall in trends after treated electrographic status epilepticus
domain: special_populations_pitfalls
topics: [post-ictal attenuation, aEEG, suppression ratio, asymmetry index, ACNS terminology]
population: child
setting: PICU
difficulty: intermediate
bloom: analysis
learning_objective: >-
  Recognize treatment-associated attenuation after status epilepticus and account for
  both post-ictal and medication effects while considering other causes clinically.

stem:
  vignette: >-
    A 6-year-old boy admitted with acute necrotizing encephalopathy has 45 minutes of
    electrographic status epilepticus, which stops after a levetiracetam load and a single
    lorazepam dose at minute 60. No continuous sedative infusion is started and the doses
    are annotated on the panel. Over the following hour the bedside nurse sees both aEEG
    margins fall together while seizure-probability and rhythmicity trends go quiet, and pages to ask whether he is
    deteriorating. Blood pressure, temperature and end-tidal carbon dioxide have been
    unchanged and the pupils remain reactive.
  image_caption: >-
    Composite. Upper: 4-hour qEEG panel (seizure probability; rhythmicity L and R; FFT 0-20 Hz L and
    R; relative asymmetry spectrogram; asymmetry index; aEEG L and R; suppression ratio L and R),
    elapsed minutes; levetiracetam and lorazepam annotated at minute 60. Lower:
    15-second raw page from minute 80, longitudinal bipolar, 7 microvolts per millimetre, 1-70 Hz
    with 60 Hz notch.
  lead_in: >-
    What is the most likely explanation for the change in the trends after treatment?

question_type: multiple_choice
options:
  - key: A
    text: Treatment-associated attenuation with possible post-ictal and lorazepam contributions
    correct: true
    rationale: >-
      The fall begins when the seizure stops and lorazepam is given, is bilateral, and
      recovers toward baseline. The display supports treatment-associated attenuation but
      cannot separate post-ictal from medication effects.
  - key: B
    text: A new hemispheric ischemic event
    correct: false
    rationale: >-
      An acute hemispheric ischemic event would produce a lateralized fall with a
      sustained deflection of the relative asymmetry spectrogram and asymmetry index,
      neither of which is present.
  - key: C
    text: Ongoing electrographic status epilepticus that the trends cannot display
    correct: false
    rationale: >-
      Continuing ictal activity would keep the rhythmicity bands and the aEEG margins up,
      not drive them down, and the raw page confirms an attenuated, non-ictal tracing.
  - key: D
    text: Progressive cerebral edema with rising intracranial pressure
    correct: false
    rationale: >-
      A rising-pressure course would evolve over hours and would not begin abruptly at
      seizure offset or start to reverse within the same window.
  - key: E
    text: Displacement of electrodes over one hemisphere
    correct: false
    rationale: >-
      An electrode problem is unilateral and abrupt, and would show as a step change in
      the asymmetry index and in only one set of derivations.

explanation: >-
  The correct answer is A. What the image shows: from minute 15 to minute 60 both
  rhythmicity spectrograms carry a continuous, broadly evolving band, the
  seizure-probability trend is saturated and both aEEG margins are elevated and narrowed.
  At minute 60, coincident with seizure termination and the annotated medications, the
  rhythmicity bands stop. Both aEEG margins then fall together, low-frequency FFT power
  drops, asymmetry stays near zero, and the margins later recover. The suppression-ratio
  panels remain near baseline, showing low voltage with preserved continuity rather than
  new suppression. The raw page at minute 80 is low-voltage, slow, continuous, symmetric
  and non-ictal. Because lorazepam and seizure offset occur together, the tracing cannot
  distinguish medication effect from post-ictal attenuation. Bilaterality and recovery
  support that interpretation but do not independently exclude global injury, metabolic
  change or electrode problems; clinical correlation remains necessary. Evidence: in 259
  critically ill children, higher maximum hourly seizure
  burden was independently associated with neurologic decline, so the correct response to
  treated status is to keep monitoring the burden rather than to reinterpret the immediate
  post-treatment trends as a specific new injury. Bedside takeaway: identify the temporal
  association, review the raw EEG and medication record, and evaluate competing causes.

key_points:
  - Concurrent seizure offset and lorazepam make post-ictal and medication effects inseparable here.
  - Falling aEEG with a flat suppression ratio indicates low voltage with preserved continuity.
  - Bilaterality, timing and recovery support the interpretation but do not exclude other causes.

