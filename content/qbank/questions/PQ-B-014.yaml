# Verification trail: content/qbank/sources/PQ-B-014.md
id: PQ-B-014
version: 1
status: draft
title: Test characteristics of a severely abnormal 24-hour aEEG background on ECMO
domain: clinical_prognosis
topics: [ECMO, aEEG background score, specificity, prognostication, neuromonitoring]
population: child
setting: ECMO
difficulty: advanced
bloom: analysis
learning_objective: >-
  State the specificity of a severely abnormal aEEG background score in the first 24 hours
  of extracorporeal membrane oxygenation for unfavorable outcome, and distinguish it from
  the sensitivity and predictive values.

stem:
  vignette: >-
    A 6-month-old infant with fulminant myocarditis is placed on venoarterial
    extracorporeal membrane oxygenation. Amplitude-integrated EEG with a raw display is
    applied within the first hour of cannulation and is scored in 3-hour blocks over the
    first day. She receives a fentanyl infusion and intermittent rocuronium boluses for
    circuit safety. Over the first 24 hours the aEEG background score is above 17. No
    electrographic seizures have occurred. The team asks how the published score
    performed for unfavorable outcome at discharge.
  image_caption: >-
    Twenty-four-hour, two-channel aEEG (C3-P3 and C4-P4) from the first day of
    extracorporeal membrane oxygenation, on the semilog amplitude axis, linear from 0 to
    10 microvolts and logarithmic from 10 to 100 microvolts. Hours from cannulation are on
    the time axis. A 15-second raw EEG inset is shown. A continuous circuit-pump artifact
    is annotated.
  lead_in: >-
    Approximately what specificity does a severely abnormal 24-hour aEEG background score
    carry for an unfavorable outcome?

question_type: multiple_choice
options:
  - key: A
    text: About 44 percent
    correct: false
    rationale: >-
      44 percent is the sensitivity of the threshold score, which is why a normal-looking
      aEEG cannot be used to rule out an unfavorable outcome.
  - key: B
    text: About 57 percent
    correct: false
    rationale: >-
      57 percent is the negative predictive value, again reflecting how poorly this test
      excludes an unfavorable outcome.
  - key: C
    text: About 75 percent
    correct: false
    rationale: >-
      No reported test characteristic of the aEEG background score in this cohort was
      near 75 percent.
  - key: D
    text: About 95 percent
    correct: false
    rationale: >-
      95 percent is the positive predictive value in this cohort, which depends on the
      local prevalence of unfavorable outcome and is not the specificity.
  - key: E
    text: About 97 percent
    correct: true
    rationale: >-
      A 24-hour aEEG background score above 17 identified unfavorable
      outcome with a specificity of 97 percent, making a severely abnormal score highly
      specific but insensitive.

explanation: >-
  The correct answer is E. What the image shows: both channels carry a low-amplitude
  band without cyclical variation, with regular circuit-pump artifact visible in the raw
  inset. The artifact contributes to the displayed aEEG envelope; this contaminated
  excerpt alone cannot confirm an artifact-free suppressed background. The test
  characteristics below apply to the expert-assessed background score given in the
  vignette, after assessment of artifact. Evidence: in a retrospective cohort of 73 neonates
  and children supported with extracorporeal membrane oxygenation and monitored with
  amplitude-integrated EEG, background was summarized as a score determined in 3-hour
  blocks within the first 24 hours. Thirty-two patients had a favorable and 41 an
  unfavorable neurologic outcome by Pediatric Cerebral Performance Category at discharge.
  A 24-hour background score above 17 was associated with an
  unfavorable outcome with a sensitivity of 44 percent, a specificity of 97 percent, a
  positive predictive value of 95 percent and a negative predictive value of 57 percent,
  and in multivariable analysis with a hazard ratio of 6.1 (95 percent confidence interval
  2.31 to 16.24). The presence of seizures was not associated with outcome at discharge.
  A separate cohort of 201 children on this support found a severely abnormal conventional
  background in 12 percent, again highly specific but insensitive for death, at 0.97 and
  0.23. Bedside takeaway: a severely abnormal early aEEG on ECMO is meaningful when
  present in this cohort but cannot determine an individual outcome; low sensitivity also
  means a score below threshold does not exclude unfavorable outcome.

key_points:
  - A severely abnormal 24-hour aEEG background on ECMO was 97 percent specific, 44 percent sensitive.
  - Positive predictive value was 95 percent and negative predictive value only 57 percent.
  - Seizures on ECMO were not associated with outcome at discharge in this 73-patient cohort.

