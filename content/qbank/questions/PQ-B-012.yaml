# Verification trail: content/qbank/sources/PQ-B-012.md
id: PQ-B-012
version: 1
status: draft
title: Next step for electrographic-only seizures in a cooled neonate with encephalopathy
domain: clinical_prognosis
topics: [neonatal seizures, electroclinical uncoupling, seizure burden, antiseizure medication]
population: neonate
setting: NICU
difficulty: intermediate
bloom: application
learning_objective: >-
  Choose EEG-guided escalation of antiseizure medication for electrographic-only neonatal
  seizures, using trial and registry evidence that treating them lowers seizure burden.

stem:
  vignette: >-
    A term neonate with moderate hypoxic-ischemic encephalopathy is on the first day of
    therapeutic hypothermia. Continuous video EEG was started at 5 hours of life. Rhythmic
    left-arm jerking at 12 hours of life prompted a phenobarbital load of 20 milligrams
    per kilogram, after which the movements stopped. The 6-hour window shown begins 1 hour
    after that load. The bedside examination is unchanged and no further movements have
    been seen, yet the trend panel and raw page show recurrent right-hemispheric
    electrographic seizures. Core temperature is 33.5 degrees Celsius.
  image_caption: >-
    Composite. Upper: 6-hour qEEG panel (seizure probability; rhythmicity L and R; FFT 0-20 Hz L and
    R; asymmetry index; aEEG L and R), elapsed time (hours:minutes); the phenobarbital load occurred
    60 minutes before the displayed window. Lower: 15-second raw page from minute 93, neonatal
    reduced montage, 7 microvolts per millimetre, 1-70 Hz with 60 Hz notch.
  lead_in: >-
    What is the best next step in the management of this infant's seizure burden?

question_type: multiple_choice
options:
  - key: A
    text: Give a second antiseizure medication load and continue EEG-guided titration
    correct: true
    rationale: >-
      In a registry, two-thirds of neonates had an incomplete response to the first load, and a
      randomized trial showed that treating electrographic seizures rather than clinical
      seizures alone substantially reduced cumulative seizure burden.
  - key: B
    text: Observe without further medication because the seizures have no clinical correlate
    correct: false
    rationale: >-
      Electroclinical uncoupling after a load is expected, not reassuring. Most neonatal
      seizures during cooling are electrographic only, and burden still tracks with
      injury and outcome.
  - key: C
    text: Observe because seizure burden does not affect outcome in cooled infants
    correct: false
    rationale: >-
      Higher burden was associated with more severe MRI injury and lower Bayley III
      scores, and the burden-outcome relationship persisted after controlling for
      hypothermia.
  - key: D
    text: Discontinue cooling so that the background can recover
    correct: false
    rationale: >-
      Cooling is the only established neuroprotective therapy here and should be
      completed. Stopping it does not treat seizures and removes a proven benefit.
  - key: E
    text: Replace continuous EEG with two 1-hour recordings each day
    correct: false
    rationale: >-
      Intermittent recording would miss most of this burden, and the point of monitoring
      is to titrate treatment against the seizures that are actually occurring.

explanation: >-
  The correct answer is A. What the image shows: the right rhythmicity spectrogram carries
  repeated discrete bands that begin near 2.5 Hz and slow over about 2 minutes, the
  seizure-probability trend rises with each, the asymmetry index deflects to the right
  during each event and returns to baseline between them, and the right aEEG margins rise
  briefly with each event while the left is unchanged. Between events both aEEG bands are
  continuous, with lower margins near 9 microvolts and upper margins near 30 microvolts
  (continuous normal voltage), so the background is not suppressed. The raw page from
  minute 93 falls inside one event and shows rhythmic sharp waves near 2 Hz, maximal over
  the right central electrode (C4), growing in voltage. The left-sided trends are quiet, so this is
  focal right-hemispheric ictal activity, not artifact and not a global change. Evidence:
  in a randomized trial of 69 neonates at or beyond 36 weeks with moderate or severe
  hypoxic-ischemic encephalopathy, 35 (51 percent) developed seizures. Excluding infants
  with status epilepticus, median cumulative seizure burden was 449 seconds
  (interquartile range 113 to 2070) in the group in which electrographic seizures were
  treated versus 2226 seconds (760 to 7654) in the group in which only clinical seizures
  were treated (p equals 0.02), with fewer seizures and shorter time to treatment.
  Increasing burden was associated with higher brain injury scores on MRI and lower scores
  across all three Bayley III domains. In the Neonatal Seizure Registry, 66 percent of 534
  neonates with acute symptomatic seizures had an incomplete response to the initial
  loading dose, and response did not differ by gestational age, sex, medication or dose.
  Bedside takeaway: clinical cessation may reflect electroclinical uncoupling; use ongoing
  EEG burden and the infant's condition to guide additional treatment.

key_points:
  - Treating electrographic seizures cut median burden from 2226 to 449 seconds in a randomized trial.
  - Two-thirds of 534 neonates had an incomplete response to the first antiseizure medication load.
  - Higher neonatal seizure burden tracked with worse MRI injury and lower Bayley III scores.

