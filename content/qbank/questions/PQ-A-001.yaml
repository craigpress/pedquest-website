id: PQ-A-001
version: 1
status: draft
title: Why the aEEG display switches from a linear to a logarithmic scale
domain: foundations
topics: [aEEG, semilogarithmic display, amplitude scaling, neonatal monitoring, trend interpretation]
population: neonate
setting: NICU
difficulty: introductory
bloom: interpretation
learning_objective: >-
  Explain how the aEEG signal is filtered and displayed on a semilogarithmic amplitude
  axis, and why that axis exaggerates changes at low voltage relative to changes at
  high voltage.

stem:
  vignette: >-
    A term neonate is admitted on day of life 1 with moderate hypoxic-ischemic
    encephalopathy and is cooled to 33.5 C. A dual-channel aEEG is running from
    homologous central-parietal derivations, with the raw EEG available on the same
    monitor. Over the first 6 hours the recording is read by the bedside nurse each
    hour. Between hour 1 and hour 3 the lower margin of the aEEG band rises from about
    3 to about 7 microvolts; between hour 3 and hour 5 the upper margin rises from
    about 40 to about 80 microvolts. On the screen, the first change moves the trace
    a visibly greater distance up the vertical axis than the second change, even though
    the second change is a much larger absolute voltage difference. The nurse asks why
    the smaller change looks bigger.
  image_caption: >-
    Six-hour dual-channel aEEG from central-parietal derivations, with the vertical
    axis labeled 0 to 100 microvolts and gridlines at 5, 10, 25, 50 and 100
    microvolts. Time axis in hours from the start of recording.
  lead_in: >-
    Which property of the aEEG display best explains why the low-voltage change appears
    larger on screen?

question_type: multiple_choice
options:
  - key: A
    text: The axis is linear from 0 to 10 microvolts and logarithmic from 10 to 100 microvolts
    correct: true
    rationale: >-
      Semilogarithmic compression is used precisely because electrocortical amplitude
      varies over an order of magnitude. The linear segment below 10 microvolts spreads
      out small changes in the lower margin, while the logarithmic segment above
      10 microvolts compresses large excursions of the upper margin.
  - key: B
    text: The axis is logarithmic from 0 to 10 microvolts and linear from 10 to 100 microvolts
    correct: false
    rationale: >-
      This inverts the convention. A logarithmic segment at the bottom of the scale
      would compress rather than expand the low-voltage range, and the low-voltage
      change would then appear smaller, not larger.
  - key: C
    text: The signal is band-pass filtered to 2 to 20 hertz, which discounts low-voltage delta activity
    correct: false
    rationale: >-
      The 2 to 20 hertz band-pass is a real step in building the aEEG and it does
      attenuate very slow activity and some artifact, but filtering changes which
      frequencies contribute to the trace, not how the amplitude axis is spaced.
  - key: D
    text: Each epoch is plotted as peak-to-peak amplitude on a single linear 0 to 100 microvolt axis
    correct: false
    rationale: >-
      On a purely linear 0 to 100 microvolt axis a 4 microvolt change would occupy one
      tenth of the screen distance of a 40 microvolt change, which is the opposite of
      what is observed.
  - key: E
    text: Time compression to 6 hours per screen widens the band more at low than at high voltage
    correct: false
    rationale: >-
      Time compression changes the horizontal resolution and can make brief events
      harder to see, but it acts equally on all amplitudes and cannot differentially
      magnify the lower margin.

explanation: >-
  The correct answer is A. The aEEG amplitude axis is semilogarithmic: linear from
  0 to 10 microvolts and logarithmic from 10 to 100 microvolts, so a few microvolts of
  change near the lower margin occupies far more screen distance than tens of
  microvolts of change near the upper margin. What the image shows: the gridlines are
  evenly spaced up to 10 microvolts and then progressively closer together at 25, 50
  and 100 microvolts, which is the visual signature of the mixed scale. Evidence: a
  pediatric neurocritical care review of qEEG trend construction describes the aEEG
  pipeline as requiring at least three electrodes, usually homologous parietal or
  central pairs plus a ground, with the signal filtered to amplify 2 to 20 hertz and
  then displayed with semilogarithmic compression, the y-axis starting linearly from
  0 to 10 microvolts and then logarithmically from 10 to 100 microvolts; the same
  convention is described in the neonatal brain-function monitoring literature.
  That design is deliberate, because the clinically decisive neonatal distinctions
  (lower margin above versus below 5 microvolts, upper margin above versus below
  10 microvolts) all sit inside the expanded linear segment. Bedside takeaway: read
  the lower margin against the printed gridlines rather than by eye, and remember
  that a visually dramatic move low on the axis may be only a few microvolts.

key_points:
  - aEEG amplitude axis is linear 0 to 10 microvolts, then logarithmic 10 to 100 microvolts.
  - The linear segment expands the low voltages where neonatal cutoffs of 5 and 10 microvolts lie.
  - aEEG is built from at least three electrodes, filtered to 2 to 20 hertz before display.

