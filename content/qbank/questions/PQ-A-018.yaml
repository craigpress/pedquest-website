id: PQ-A-018
version: 1
status: draft
title: Separating chest physiotherapy artifact from the real seizure on a panel
domain: seizure_detection
topics: [chest physiotherapy artifact, seizure mimics, point to feature, rhythmicity spectrogram, aEEG arch]
population: infant
setting: PICU
difficulty: intermediate
bloom: interpretation
learning_objective: >-
  Discriminate a scheduled rhythmic mechanical artifact from a true electrographic
  seizure on a multi-trend panel and select the true seizure by its evolution and
  lateralised amplitude rise.

stem:
  vignette: >-
    A 7-month-old boy is admitted to the PICU with bronchiolitis, respiratory failure
    and a new right-sided focal seizure at presentation. He is intubated on a
    dexmedetomidine infusion and is not receiving neuromuscular blockade. He has
    scheduled chest physiotherapy. Continuous EEG with a quantitative trend panel is
    running. Over 4 hours the panel shows two conspicuous events. The first is a
    sustained bilateral rhythmic band that starts and stops abruptly, lasting about
    10 minutes, with no frequency evolution and no change in the asymmetry index. The
    second is a 90-second event with a rhythmicity band slowing from 4 to 1.5 hertz
    over the left hemisphere, an arched rise in the left aEEG, a leftward asymmetry
    deflection, and a brief fall in left amplitude afterward.
  image_caption: >-
    Four-hour qEEG panel, top to bottom: seizure probability; rhythmicity spectrogram (left, right);
    FFT spectrogram (left, right); relative asymmetry spectrogram and asymmetry index; aEEG (left,
    right). Scheduled chest physiotherapy is annotated at 70 minutes. Time axis in hours:minutes
    from the start of recording.
  lead_in: >-
    Click the electrographic seizure on the left rhythmicity spectrogram panel.

question_type: point_to_feature
options: []
point_to_feature:
  instruction: >-
    Click the left rhythmicity spectrogram at the evolving 90-second event, not at the
    sustained bilateral band that coincides with chest physiotherapy.
  target_event: 1
  target_panel: rhythmicity_L
  tolerance: 0.03

explanation: >-
  The expected region is the evolving event at 150 minutes on the left rhythmicity
  spectrogram. What the image shows: two events that a bedside reader would flag and
  that the seizure-probability trend scores similarly, but only one of which evolves.
  The 70-minute event is bilateral, fixed in frequency, begins and ends abruptly with
  the annotated chest physiotherapy, lasts as long as the treatment, and leaves the
  asymmetry index at zero and the aEEG margins unchanged in shape. The 150-minute
  event is lateralised, slows from 4 to 1.5 hertz over about 90 seconds, produces a
  solid flame on the left FFT spectrogram, arches the left aEEG upward, deflects the
  asymmetry index to the left, and is followed by a brief post-ictal fall in left
  amplitude. Evidence: a pediatric neurocritical care review of qEEG in the ICU states
  that rhythmic patterns such as patting and respiratory therapy artifact are less
  likely to be removed by artifact-reduction algorithms and that both can be mistaken
  for seizures if the raw EEG and video are not reviewed, and separately that the
  rhythmicity spectrogram is susceptible to highlighting repetitive artifacts from
  respiratory treatments or patting. Published pediatric performance data show why
  the confusion matters: in 27 continuous EEG recordings containing 553 seizures over
  487 hours, blinded neurophysiologists reached a median sensitivity of 83.3 percent
  with color density spectral array and 81.5 percent with aEEG, with false positives
  occurring about once every 17 to 20 hours. Bedside takeaway: check the nursing
  schedule before you check the drug chart, then open the raw EEG.

key_points:
  - Chest physiotherapy artifact is bilateral, fixed in frequency, and treatment-locked.
  - A seizure evolves in frequency and lifts the aEEG and asymmetry trends on one side.
  - Artifact reduction rarely removes rhythmic respiratory or patting artifact.

