# Verification trail: content/qbank/sources/PQ-B-015.md
id: PQ-B-015
version: 1
status: draft
title: Timing of early post-traumatic seizures and the risk of post-traumatic epilepsy
domain: clinical_prognosis
topics: [traumatic brain injury, early post-traumatic seizures, post-traumatic epilepsy, sleep spindles]
population: child
setting: PICU
difficulty: advanced
bloom: analysis
learning_objective: >-
  Relate the timing of early post-traumatic seizures to the odds of later post-traumatic
  epilepsy in children undergoing multimodality neuromonitoring after traumatic brain
  injury.

stem:
  vignette: >-
    A 7-year-old boy is admitted after a high-speed motor vehicle collision with a severe
    traumatic brain injury, bilateral contusions and a subdural hematoma. An intracranial
    pressure monitor and continuous EEG with a quantitative trend panel are placed on the
    day of injury. He receives a fentanyl infusion and hypertonic saline; no continuous
    sedative infusion is used after the first day. The trend panel shown covers the
    second day after injury, roughly 30 to 54 hours from the collision, during which
    repeated electrographic seizures appear. Intracranial pressure has been 12 to 22
    millimetres of mercury.
  image_caption: >-
    Twenty-four-hour qEEG panel covering roughly 30 to 54 hours after injury: seizure probability;
    rhythmicity spectrogram (left, right); FFT spectrogram 0-20 Hz (left, right); relative asymmetry
    spectrogram; asymmetry index; suppression ratio (left, right). Elapsed time (hours:minutes) from
    the start of the window on the time axis.
  lead_in: >-
    In the cited 61-child cohort, which seizure-timing subgroup was associated with later
    post-traumatic epilepsy?

question_type: multiple_choice
options:
  - key: A
    text: Seizures between 24 and 168 hours after injury carry the strongest association
    correct: true
    rationale: >-
      In a pediatric multimodality monitoring cohort, seizures occurring between 24 and
      168 hours after injury carried an odds ratio of 21.47 for post-traumatic epilepsy,
      the strongest timing signal reported.
  - key: B
    text: Seizures within the first 24 hours carry the strongest association
    correct: false
    rationale: >-
      The association with later epilepsy was significant for seizures between 24 and 168
      hours but not for those occurring within the first 24 hours after injury.
  - key: C
    text: Timing does not matter; any early seizure carries the same risk
    correct: false
    rationale: >-
      Early post-traumatic seizures overall were associated with epilepsy, but the
      association was carried by the later part of the first week, so timing does matter.
  - key: D
    text: Only seizures occurring after 7 days are associated with later epilepsy
    correct: false
    rationale: >-
      Seizures after 7 days are late post-traumatic seizures and are by definition part
      of the epilepsy outcome; the point here is that seizures within the first week
      already predict it.
  - key: E
    text: The association holds only when intracranial pressure remains normal
    correct: false
    rationale: >-
      Raised intracranial pressure was itself an independent predictor of post-traumatic
      epilepsy, so normal pressure is not a condition for the seizure-timing association.

explanation: >-
  The correct answer is A. What the image shows: both rhythmicity spectrograms carry
  repeated discrete bands over the 24-hour window, most prominent on the left, each
  starting near 4 Hz and slowing over roughly 90 seconds; the seizure-probability trend
  rises with each; the relative asymmetry spectrogram and asymmetry index deflect
  leftward during the events and return between them; the suppression-ratio trends stay
  low, confirming that the child is not pharmacologically suppressed. These are recurrent
  focal electrographic seizures on the second day after injury, that is, in the 24-to-168
  hour window. Evidence: 61 surviving children who underwent multimodality neurologic
  monitoring after traumatic brain injury, including continuous EEG and intracranial
  pressure monitoring, were analysed for post-traumatic epilepsy, defined as unprovoked
  seizures 2 months after injury or a continued need for antiseizure medication at 12
  months; 10 (16.4 percent) developed it. Early post-traumatic seizures within the first 7
  days carried an odds ratio of 7.58 (95 percent confidence interval 1.81 to 39.68), and
  this association was significant for seizures occurring between 24 and 168 hours after
  injury, odds ratio 21.47 (4.18 to 110.38), but not for those within the first 24 hours.
  Among children with early seizures, more time in seizure on surface EEG raised the odds
  further, 7.28 (2.05 to 73.14). Epileptiform discharges, odds ratio 8.06, abnormal sleep
  spindles, 4.88, raised intracranial pressure, 1.25, and impaired cerebrovascular
  pressure reactivity were also associated. The significance of one subgroup and not
  another does not itself prove that the subgroup effects differ. Bedside takeaway:
  document, quantify and follow all early post-traumatic seizures while recognizing the
  uncertainty in this small cohort.

key_points:
  - Seizures 24 to 168 hours after pediatric TBI carried an odds ratio of 21.47 for later epilepsy.
  - Seizures within the first 24 hours were not independently associated with epilepsy.
  - Epileptiform discharges and abnormal sleep spindles also predicted post-traumatic epilepsy.

