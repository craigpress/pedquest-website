id: PQ-A-007
version: 1
status: draft
title: Locating the pentobarbital effect on the suppression-ratio panel
domain: foundations
topics: [suppression ratio, pentobarbital, trend timing, point to feature, burst suppression]
population: child
setting: PICU
difficulty: introductory
bloom: interpretation
learning_objective: >-
  Locate on a multi-trend panel the point at which an anesthetic dose change takes
  effect, using the suppression ratio as the trend that responds.

stem:
  vignette: >-
    A 6-year-old boy with refractory status epilepticus has been on a pentobarbital
    infusion in the PICU for 18 hours. Continuous EEG with a quantitative trend panel
    is running. Overnight the team increased the infusion once, but the paper record of
    the time of that change was lost during a handoff and the annotation was never
    entered on the EEG. The attending asks you to establish from the trend panel alone
    when the higher rate began to take effect, so that the timing can be reconciled
    with the pharmacy record before rounds. No antiseizure medication boluses, imaging
    trips, or respiratory treatments occurred during the displayed window, and the
    electrode impedances were stable throughout.
  image_caption: >-
    Six-hour qEEG panel, top to bottom: suppression ratio (left, right), 0 to 100
    percent; aEEG (left, right); FFT spectrogram (left, right), 0 to 20 hertz. Time
    axis in minutes from the start of the displayed window. No medication annotations
    are shown.
  lead_in: >-
    Click the point on the left suppression-ratio panel where the increased
    pentobarbital rate begins to take effect.

question_type: point_to_feature
options: []
point_to_feature:
  instruction: >-
    Click on the left suppression-ratio trace at the onset of the sustained rise
    toward the new plateau.
  target_event: 0
  target_panel: suppression_ratio_L
  tolerance: 0.04

explanation: >-
  The expected region is the onset of the sustained rise in the left suppression-ratio
  trace, which begins at 150 minutes and ramps over about 15 minutes to a new plateau
  near 70 percent. What the image shows: before 150 minutes the suppression ratio sits
  at a stable low plateau while the aEEG band is comparatively wide and the FFT
  spectrograms show continuous power; from 150 minutes the suppression ratio climbs
  bilaterally and symmetrically, the aEEG margins fall and narrow, and the spectrograms
  break up into intermittent columns of power separated by dark interburst intervals.
  The suppression ratio is the trend that answers this question because it is defined
  as the percentage of time the EEG signal is below a prespecified amplitude consistent
  with suppression, displayed as a running average, so a deepening anesthetic effect
  moves it directly and in a single direction. The aEEG and the spectrogram change too,
  but both are also moved by seizures, state change and artifact, so neither
  localises a dose effect as cleanly. Evidence: a pediatric neurocritical care review
  of qEEG in the ICU states that the suppression ratio can be used to assess the degree
  of burst suppression and to titrate anesthetic infusions to a specific target for
  super-refractory status epilepticus and for refractory intracranial hypertension.
  Because the running average is computed over an epoch, the trend inflection lags the
  true dose change by the length of that epoch plus the pharmacokinetic ramp. Bedside
  takeaway: annotate infusion changes on the EEG in real time; reconstructing them
  from a trend gives an approximate time at best.

key_points:
  - The suppression ratio is the trend that tracks depth of pharmacologic suppression.
  - A deepening anesthetic raises the suppression ratio while aEEG margins fall.
  - Trend inflections lag the real dose change by the epoch length plus drug ramp.

