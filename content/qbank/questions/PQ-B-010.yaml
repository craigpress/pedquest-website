id: PQ-B-010
version: 1
status: draft
title: Hypothermia moves the aEEG prognostic window in neonatal encephalopathy
domain: clinical_prognosis
topics: [neonatal HIE, therapeutic hypothermia, aEEG, time to normal trace, prognostication]
population: neonate
setting: NICU
difficulty: advanced
bloom: application
learning_objective: >-
  Explain why an abnormal aEEG at 3 to 6 hours is a weaker predictor under therapeutic
  hypothermia and identify the time to recovery of a normal background as the better
  predictor.

stem:
  vignette: >-
    A term neonate meets cooling criteria after perinatal asphyxia and starts therapeutic
    hypothermia at 3 hours of life, with core temperature held at 33.5 degrees Celsius.
    Two-channel amplitude-integrated EEG was applied at 2 hours of life. The window shown
    covers 3 to 6 hours of life. No antiseizure medication has been given and one
    morphine dose was given at 3 hours. At 8 hours of life a trainee asks whether the team
    can now tell the parents that the outlook is poor on the basis of this tracing.
  image_caption: >-
    Three-hour, two-channel aEEG (C3-P3 and C4-P4) covering 3 to 6 hours of life, on the
    semilog amplitude axis, linear from 0 to 10 microvolts and logarithmic from 10 to 100
    microvolts. Hours of life are on the time axis. A 15-second raw EEG inset is shown.
    Core temperature was 33.5 degrees Celsius throughout.
  lead_in: >-
    What is the most appropriate use of this 3-to-6-hour tracing for prognosis in a cooled
    infant?

question_type: multiple_choice
options:
  - key: A
    text: Defer a definitive prognosis and reassess the background serially through at least 48 hours
    correct: true
    rationale: >-
      Under hypothermia the positive predictive value of an abnormal 3-to-6-hour pattern
      falls to 59 percent, and infants with good outcome had normalized by 48 hours rather
      than 24 hours.
  - key: B
    text: Counsel that outcome is very likely poor on the basis of the 3-to-6-hour pattern
    correct: false
    rationale: >-
      That inference is valid at normothermia, where the positive predictive value was 84
      percent, but not under hypothermia, where it fell to 59 percent.
  - key: C
    text: Counsel that outcome is very likely poor if the same pattern persists at 12 hours of life
    correct: false
    rationale: >-
      Twelve hours is still too early. In cooled infants only abnormalities persisting at
      and beyond 24 hours were associated with poor outcome, and severe abnormalities
      became significantly predictive after 36 hours.
  - key: D
    text: Stop cooling, because the background already establishes a poor prognosis
    correct: false
    rationale: >-
      This is the most harmful option. An early severe aEEG does not identify infants who
      cannot benefit, and cooling should be completed.
  - key: E
    text: Rely on the moderately abnormal voltage criteria at 3 to 6 hours instead of the pattern
    correct: false
    rationale: >-
      A moderately abnormal voltage background at 3 to 6 hours did not predict outcome in
      the cooled cohort, so substituting voltage for pattern does not help.

explanation: >-
  The correct answer is A. What the image shows: over the 3-to-6-hour window both channels
  are discontinuous with high-voltage bursts rising from an essentially isoelectric
  interburst lower margin, no cyclical variation, and a raw inset confirming suppression
  between bursts. This is burst suppression at 3 to 6 hours in an infant already at 33.5
  degrees. Evidence: 74 infants recruited with CoolCap entry criteria had 72 hours of aEEG
  and Bayley Scales of Infant Development II at 18 months. The positive predictive value
  of an abnormal aEEG pattern at 3 to 6 hours of age was 84 percent under normothermia but
  only 59 percent under hypothermia, and a moderately abnormal voltage background at 3 to
  6 hours did not predict outcome at all. The recovery time to a normal background pattern
  was the best predictor of poor outcome, at 96.2 percent under hypothermia and 90.9
  percent under normothermia, and never developing sleep-wake cycling always predicted a
  poor outcome. Infants with good outcome had normalized by 24 hours when treated with
  normothermia and by 48 hours when treated with hypothermia. In a separate cohort of 23
  cooled infants, 10 of 15 with a burst-suppression pattern or worse at 6 hours had a
  normal outcome at 1 year, and only abnormalities persisting at and beyond 24 hours
  carried a poor prognosis. Bedside takeaway: under cooling, the clock for aEEG
  prognostication should not end at 6 hours. These cohort time points are not universal
  deadlines; use serial EEG with the full multimodal assessment.

key_points:
  - Under hypothermia the positive predictive value of an abnormal 3-to-6-hour aEEG fell to 59 percent.
  - Time to recovery of a normal background was the best predictor, 96.2 percent under hypothermia.
  - Good-outcome cooled infants normalized by 48 hours; 10 of 15 with burst suppression at 6 hours did well.

