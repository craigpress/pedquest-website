id: PQ-A-023
version: 1
status: draft
title: Clicking the abrupt diffuse attenuation on the trend panel
domain: background_terminology
topics: [ACNS 2021 terminology, attenuation, suppression, point to feature, post-ictal state]
population: child
setting: PICU
difficulty: advanced
bloom: interpretation
learning_objective: >-
  Locate an abrupt diffuse attenuation on a trend panel and distinguish it from a
  post-ictal amplitude fall and from a sedation-related decline, using the ACNS
  definitions of attenuation and suppression.

stem:
  vignette: >-
    A 12-year-old boy is in the PICU after repair of a coarctation of the aorta,
    monitored with continuous EEG and a quantitative trend panel for encephalopathy.
    He is on a stable dexmedetomidine infusion. Three separate amplitude declines occur
    during the displayed 6 hours. The first follows a 100-second electrographic seizure
    and resolves gradually over about 1 minute. The second is a slow bilateral decline
    beginning at the time a midazolam bolus was given for agitation and it does not
    recover within the window. The third is abrupt, bilateral, reaches its nadir within
    seconds, holds for about 8 minutes, and then returns abruptly to the prior
    amplitude; the aEEG lower margin during it stays above 10 microvolts.
  image_caption: >-
    Six-hour qEEG panel, top to bottom: aEEG (left, right) on a semilogarithmic axis
    with a 10 microvolt gridline; envelope trend (left, right); suppression ratio
    (left, right), threshold 10 microvolts; relative asymmetry spectrogram. Time axis
    in minutes from the start of the displayed window; a midazolam bolus is annotated.
  lead_in: >-
    Click the abrupt diffuse attenuation on the left aEEG panel.

question_type: point_to_feature
options: []
point_to_feature:
  instruction: >-
    Click the left aEEG trace at the abrupt bilateral amplitude drop that recovers
    abruptly, not at the post-ictal fall or the sedation-related decline.
  target_event: 2
  target_panel: aeeg_L
  tolerance: 0.03

explanation: >-
  The expected region is the abrupt bilateral amplitude drop beginning at 300 minutes
  on the left aEEG panel. What the image shows: three declines with distinguishable
  shapes. At 60 minutes an arched seizure is followed by a brief graded fall that
  recovers over about a minute, the classic post-ictal pattern. At 180 minutes, at the
  annotated midazolam bolus, both aEEG bands drift down over several minutes and stay
  down. At 300 minutes the bands fall within seconds, hold flat for about 8 minutes,
  and then rise abruptly back to the prior level, while the suppression ratio stays
  near zero because the lower margin never drops below the 10 microvolt threshold and
  the asymmetry spectrogram remains neutral. Evidence: the ACNS 2021 terminology
  separates these two magnitudes explicitly. Attenuation means periods in which the
  lower voltage is at least 10 microvolts but less than 50 percent of the higher
  voltage background; suppression means periods in which the lower voltage is below
  10 microvolts. Because the lower margin here remains above 10 microvolts, this
  episode is an attenuation and not a suppression, which is why a suppression ratio
  configured at a 10 microvolt threshold barely moves. The terminology also notes that
  when attenuations or suppressions are stimulus-induced they are labelled
  SI-attenuation or SI-suppression, and a pediatric review notes that persistent
  changes in asymmetry spectrograms may reflect cerebral perfusion or extracerebral
  causes. Bedside takeaway: an abrupt attenuation that recovers abruptly and is not
  explained by drug or post-ictal state warrants immediate evaluation for a perfusion
  event.

key_points:
  - ACNS attenuation is at least 10 microvolts; suppression is below 10 microvolts.
  - Post-ictal falls follow a seizure and recover gradually over about a minute.
  - A suppression ratio set at 10 microvolts will not register an attenuation.

