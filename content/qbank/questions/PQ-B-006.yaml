# Verification trail: content/qbank/sources/PQ-B-006.md
id: PQ-B-006
version: 1
status: draft
title: Which post-arrest EEG observation carries prognostic weight, and when
domain: clinical_prognosis
topics: [cardiac arrest, timing of prognostication, background continuity, serial EEG]
population: adolescent
setting: PICU
difficulty: intermediate
bloom: application
learning_objective: >-
  Identify continuous background activity within the first 12 hours after return of
  spontaneous circulation as an EEG observation associated with good short-term outcome
  in a retrospective cohort.

stem:
  vignette: >-
    A 14-year-old boy has an in-hospital cardiac arrest from a ventricular arrhythmia,
    with 8 minutes of cardiopulmonary resuscitation before return of spontaneous
    circulation. Targeted temperature management at 36.5 degrees Celsius is used. He is
    intubated on fentanyl alone, without a sedative infusion or neuromuscular blockade.
    Continuous EEG begins 3 hours after return of spontaneous circulation. A raw page from
    the tenth hour is shown. The intensivist plans to repeat the background score at 24,
    48 and 72 hours and use the trajectory to guide the family discussion.
  image_caption: >-
    Fifteen-second raw EEG page from the tenth hour after return of spontaneous
    circulation, longitudinal bipolar montage, 19 scalp electrodes, 7 microvolts per
    millimetre, filters 1 to 70 Hz with a 60 Hz notch. Time of day is suppressed. No
    events or annotations fall within the displayed window.
  lead_in: >-
    Which observation from this recording carries prognostic weight for outcome at
    hospital discharge?

question_type: multiple_choice
options:
  - key: A
    text: Continuous background activity present within 12 hours of return of spontaneous circulation
    correct: true
    rationale: >-
      On multivariable analysis of 73 children after cardiac arrest, continuous
      background activity within 12 hours of return of spontaneous circulation was
      associated with good short-term neurologic outcome.
  - key: B
    text: Improvement in the background score between 24 and 72 hours
    correct: false
    rationale: >-
      Change in background score over time was not associated with outcome in this
      cohort, and factor scores derived from standardized features were stable across
      12-hour epochs for most children.
  - key: C
    text: Deterioration in the background score between 24 and 72 hours
    correct: false
    rationale: >-
      The same analysis found no association for serial change in either direction; a few
      individual children did change, mostly those with intermediate initial scores.
  - key: D
    text: The background score recorded at the end of continuous EEG monitoring
    correct: false
    rationale: >-
      Electroencephalographic data collected after the initial period did not add
      prognostic information beyond the early recording in this cohort.
  - key: E
    text: The total number of hours of continuous EEG completed
    correct: false
    rationale: >-
      Monitoring duration is a resource and workflow variable. It carries no direct
      prognostic meaning in post-arrest cohorts.

explanation: >-
  The correct answer is A. What the image shows: at hour 10 the page carries continuous,
  moderately slow cerebral activity across all chains, without interburst intervals,
  burst suppression or generalized attenuation, and without periodic patterns. Continuity
  at this early time point was associated with favorable outcome in the cited cohort.
  Evidence: in a retrospective cohort of non-neonatal children with a
  cardiac arrest lasting more than 2 minutes who were monitored within 72 hours of return
  of spontaneous circulation, multivariable analysis of 73 children found that an arrest
  duration under 20 minutes or continuous background activity within 12 hours of return of
  spontaneous circulation was associated with good short-term neurologic outcome, whereas
  change in background score over time and data collected after the initial hour were not
  associated with outcome. A separate analysis of 89 consecutive children with 453 scored
  EEG segments reduced standardized features to two factors, background and intermittent,
  and found that factor scores did not change significantly across 12-hour epochs to 72
  hours, although heat maps showed that some individual children with intermediate initial
  scores did shift. Failure to detect a trajectory association in these data does not show
  that later evolution is generally uninformative. Bedside takeaway: document the early
  background and continue serial, multimodal assessment through the prognostic window.

key_points:
  - Continuous background within 12 hours of return of spontaneous circulation predicted good outcome.
  - Serial change in background score was not associated with outcome after pediatric arrest.
  - Standardized background factor scores were stable across 12-hour epochs for most children.

