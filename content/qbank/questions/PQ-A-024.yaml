id: PQ-A-024
version: 1
status: draft
title: Classifying lateralized rhythmic delta activity on the ictal-interictal continuum
domain: background_terminology
topics: [ACNS 2021 terminology, LRDA, ictal-interictal continuum, electrographic seizure, fluctuation]
population: adolescent
setting: PICU
difficulty: advanced
bloom: analysis
learning_objective: >-
  Apply the ACNS 2021 criteria to decide whether a lateralized rhythmic delta pattern
  qualifies as an electrographic seizure, as a pattern on the ictal-interictal
  continuum, or as neither.

stem:
  vignette: >-
    A 16-year-old girl is admitted to the PICU with autoimmune encephalitis and
    fluctuating alertness. She is not intubated and is on no sedative infusion.
    Continuous EEG with a quantitative trend panel is running. For the past 3 hours the
    left hemisphere shows continuous rhythmic delta activity at an average of
    1.5 hertz. It is present in runs lasting 3 to 8 minutes at a time, does not evolve
    in frequency, location or morphology, and shows repeated quantifiable changes in
    frequency and amplitude that do not qualify as evolution. There are no superimposed
    fast activity or sharp waves. No antiseizure medication has been given during the
    displayed window and her examination is unchanged.
  image_caption: >-
    Fifteen-second raw EEG page in longitudinal bipolar montage at 7 microvolts per millimetre,
    low-frequency filter 1 hertz, high-frequency filter 70 hertz, 60 hertz notch on, taken from
    within one run, with a 4-hour rhythmicity spectrogram strip for both hemispheres displayed below
    the page.
  lead_in: >-
    How should this pattern be classified under the ACNS 2021 terminology?

question_type: multiple_choice
options:
  - key: A
    text: Electrographic seizure, because a rhythmic pattern persists beyond 10 seconds
    correct: false
    rationale: >-
      An electrographic seizure requires either epileptiform discharges averaging more
      than 2.5 hertz for at least 10 seconds or any pattern with definite evolution
      lasting at least 10 seconds. This pattern is 1.5 hertz and does not evolve.
  - key: B
    text: Electrographic status epilepticus, because the pattern occupies most of the hour
    correct: false
    rationale: >-
      Electrographic status epilepticus is defined as an electrographic seizure for at
      least 10 continuous minutes or for at least 20 percent of any 60-minute period;
      because this pattern is not a seizure, the duration criteria do not apply.
  - key: C
    text: A pattern on the ictal-interictal continuum, given the fluctuation
    correct: true
    rationale: >-
      Any lateralized rhythmic delta activity averaging more than 1 hertz for at least
      10 seconds with a plus modifier or fluctuation, and not qualifying as a seizure or
      status, is on the ictal-interictal continuum; fluctuation is present here.
  - key: D
    text: Lateralized rhythmic delta activity only, since it is under 2.5 hertz
    correct: false
    rationale: >-
      Naming the pattern is correct but incomplete. Once fluctuation is present in
      lateralized rhythmic delta activity above 1 hertz, the terminology places it on
      the ictal-interictal continuum, which carries different management implications.
  - key: E
    text: Brief potentially ictal rhythmic discharges, because runs are self-limited
    correct: false
    rationale: >-
      All brief potentially ictal rhythmic discharges are shorter than 10 seconds by
      definition; runs of several minutes are far too long to qualify.

explanation: >-
  The correct answer is C. The decision proceeds in a fixed order: first ask whether
  the pattern is an electrographic seizure or status, and only if it is neither ask
  whether it sits on the ictal-interictal continuum. What the image shows: continuous
  1.5 hertz rhythmic delta confined to the left hemisphere, with a dense sustained band
  on the left rhythmicity spectrogram and a quiet right side, and repeated changes in
  frequency and amplitude across the run without the ordered, sequential change in
  frequency, morphology or location that would constitute evolution. Evidence: the ACNS
  2021 terminology defines an electrographic seizure as epileptiform discharges
  averaging more than 2.5 hertz for at least 10 seconds, that is more than 25
  discharges in 10 seconds, or any pattern with definite evolution lasting at least
  10 seconds; electrographic status epilepticus as an electrographic seizure for at
  least 10 continuous minutes or for a total duration of at least 20 percent of any
  60-minute period, the 20 percent threshold lowered from the previous 50 percent
  partly on the basis of a study in critically ill children in whom the risk of
  neurological decline was significantly greater when the maximum hourly seizure burden
  exceeded 20 percent. It then lists among the ictal-interictal continuum patterns any
  lateralized rhythmic delta activity averaging more than 1 hertz for at least 10
  seconds with a plus modifier or fluctuation, explicitly including LRDA, BIRDA, UIRDA
  and MfRDA but not generalized rhythmic delta activity, provided the pattern does not
  qualify as a seizure or status. The continuum is a purely electrographic term and not
  a diagnosis, and it may warrant a diagnostic treatment trial in the appropriate
  clinical context. Bedside takeaway: LRDA with fluctuation is a reason to consider a
  diagnostic drug trial, not a reason to call the record ictal.

key_points:
  - Electrographic seizure needs over 2.5 hertz for 10 seconds or definite evolution.
  - LRDA over 1 hertz with a plus modifier or fluctuation lies on the ictal-interictal continuum.
  - LRDA can meet IIC criteria; GRDA alone does not meet this specific RDA criterion.

