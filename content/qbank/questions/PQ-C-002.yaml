id: PQ-C-002
version: 1
status: draft
title: Marking the region of onset on a four-region spectrogram display
domain: seizure_detection
topics:
  - regional spectrogram
  - region of onset
  - lateral versus parasagittal chains
  - qEEG screening
population: child
setting: PICU
difficulty: introductory
bloom: interpretation
learning_objective: >-
  Identify on a four-region spectrogram which electrode chain a rhythmic
  event arises from, and recognise that the regional layout is what makes
  that identification possible.
stem:
  vignette: >-
    A 6-year-old is on continuous EEG in the paediatric intensive care unit
    after a prolonged seizure. The overnight quantitative screen is displayed
    as four regional spectrograms on one shared decibel colour scale: left
    lateral, left parasagittal, right parasagittal and right lateral. Reviewing
    the trend, you are asked to mark where the first discrete event begins so
    that the team can go straight to that point in the raw recording.
  image_caption: >-
    Three-hour qEEG panel, top to bottom: FFT spectrogram of the left lateral,
    left parasagittal, right parasagittal and right lateral chains, 0 to 20
    hertz, elapsed time (hours:minutes), all four sharing one decibel scale.
  lead_in: >-
    Click on the first discrete event, in the panel where it is strongest.
question_type: point_to_feature
point_to_feature:
  instruction: >-
    Click the onset of the first discrete rhythmic event, in the regional
    panel that shows it most strongly.
  target_event: 0
  target_panel: fft_LL
  tolerance: 0.05
options: []
explanation: >-
  The first event begins about an hour into the recording and appears as a
  ramping band of increased power that is clearly strongest in the left
  lateral panel, the Fp1-F7-T3-T5-O1 chain. The left parasagittal panel from
  the same hemisphere shows only a faint change at the same moment, and
  neither right-sided panel changes, so the event is regional rather than
  hemispheric or generalised. Because a spectrogram is a display of the power
  in the underlying raw EEG rather than a separate measurement, marking the
  onset here tells the reviewer exactly where to open the raw tracing to
  confirm what the event is. The comparison is only valid because all four
  panels share one colour scale: with per-panel autoscaling each region is
  stretched to its own range and the regions stop being comparable.
key_points:
  - >-
    On a four-region display the chain with the strongest change identifies
    the region of onset.
  - >-
    A faint change in the neighbouring chain of the same hemisphere is
    expected and does not make an event hemispheric.
  - >-
    Regional panels are only comparable when they share one colour scale.
