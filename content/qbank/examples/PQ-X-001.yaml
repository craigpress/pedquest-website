image:
  kind: qeeg_panel
  license: synthetic-original
  attribution: null
  spec:
    seed: 20100922
    age_group: child
    sample_rate: 256
    channels: standard_19
    duration_min: 240
    background:
      type: continuous
      dominant_hz: 5.5
      amplitude_uv: 45
      slow_fraction: 0.45
      reactivity: present
    events:
      - type: artifact
        kind: emg_chewing
        at_min: 70
        duration_s: 150
        side: left
        intensity: high
      - type: seizure
        onset_min: 95.0
        duration_s: 130
        onset_region: left_temporal
        evolution: { start_hz: 4.0, end_hz: 1.5, amplitude_start_uv: 50, amplitude_end_uv: 160 }
        spread: hemispheric
        postictal_attenuation_s: 45
    annotations:
      - { at_min: 100, label: "Lorazepam 0.1 mg/kg" }
    panels:
      - seizure_probability
      - rhythmicity_L
      - rhythmicity_R
      - fft_L
      - fft_R
      - asymmetry_relative
      - asymmetry_index
      - aeeg_L
      - aeeg_R
      - suppression_ratio_L
      - suppression_ratio_R
    time_axis: elapsed

